<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 신비로운 인연 분석기 ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --mystic-purple: #6e57e0;
            --light-purple: #decaff;
            --deep-purple: #2a1b5d;
            --star-gold: #fff9c4;
            --bg-night: #1a1a2e;
            --event-gold: linear-gradient(45deg, #f1c40f, #f39c12);
        }
        body { font-family: 'Jua', sans-serif; background: var(--bg-night); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #2a1b5d 0%, #1a1a2e 100%);
            z-index: -1;
        }

        .container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: var(--light-purple); text-shadow: 0 0 10px var(--mystic-purple); margin-bottom: 30px; }
        
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid var(--mystic-purple); margin-bottom: 20px; }
        .section-title { color: var(--star-gold); margin-bottom: 15px; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        
        label { display: block; font-size: 0.85rem; color: var(--light-purple); margin-bottom: 5px; margin-left: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(0,0,0,0.3); color: white; margin-bottom: 12px; font-family: 'Jua'; box-sizing: border-box; font-size: 1rem; }
        
        .flex-row { display: flex; gap: 10px; align-items: flex-end; }
        .flex-item { flex: 1; }
        
        .checkbox-group { display: flex; align-items: center; font-size: 0.85rem; gap: 8px; color: #ccc; margin-bottom: 10px; cursor: pointer; }
        .checkbox-group input { width: auto; margin: 0; cursor: pointer; }

        .agree-container { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin-bottom: 20px; }

        .btn-submit { width: 100%; padding: 18px; background: linear-gradient(45deg, var(--mystic-purple), #a29bfe); color: white; border: none; border-radius: 20px; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 15px rgba(110, 87, 224, 0.4); transition: 0.3s; }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        #resultLayer { display: none; text-align: center; }
        .slide { display: none; animation: fadeIn 0.6s ease-out; text-align: left; }
        .slide.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 5px solid var(--star-gold); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 2.8rem; margin: 0 auto 25px; color: var(--star-gold); background: rgba(0,0,0,0.3); box-shadow: 0 0 25px rgba(255, 249, 196, 0.2); }
        .score-label { font-size: 0.9rem; margin-top: -5px; opacity: 0.8; }
        
        .analysis-card { background: rgba(255,255,255,0.07); padding: 22px; border-radius: 22px; border-left: 5px solid var(--mystic-purple); margin-bottom: 20px; line-height: 1.9; font-size: 0.98rem; color: #f0f0f0; white-space: pre-wrap; word-break: keep-all; }
        .card-sub { color: var(--star-gold); font-size: 1.15rem; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; font-weight: bold; }

        .nav-btns { display: flex; gap: 10px; margin-top: 25px; }
        .btn-nav { flex: 1; padding: 15px; border-radius: 15px; border: 1px solid var(--mystic-purple); background: rgba(110, 87, 224, 0.15); color: white; cursor: pointer; font-family: 'Jua'; font-size: 1.1rem; }
        .btn-nav.next { background: var(--mystic-purple); }
        
        /* 이벤트 응모 버튼 스타일 */
        .event-banner { background: var(--event-gold); color: #000; padding: 20px; border-radius: 20px; margin: 30px 0 10px; cursor: pointer; border: none; font-family: 'Jua'; font-size: 1.25rem; font-weight: bold; position: relative; overflow: hidden; transition: transform 0.2s; box-shadow: 0 0 20px rgba(241, 196, 15, 0.5); width: 100%; text-align: center; }
        .event-banner:active { transform: scale(0.95); }
        .event-banner::after { content: "SPECIAL GIFT"; position: absolute; top: 0; right: 0; background: #000; color: #f1c40f; font-size: 0.6rem; padding: 2px 8px; border-radius: 0 0 0 10px; }
        
        .share-group { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 15px; }
        .btn-share-link { background: linear-gradient(45deg, #ff7675, #ef5777); color: white; border: none; padding: 20px; border-radius: 20px; font-size: 1.3rem; font-family: 'Jua'; cursor: pointer; }
        
        @keyframes pulse-gold { 0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(241, 196, 15, 0); } 100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); } }
        .animate-pulse { animation: pulse-gold 2s infinite; }
    </style>
</head>
<body>

<div class="container">
    <div id="inputLayer">
        <h1>✨ 번호 궁합 분석 ✨</h1>
        <form id="loveForm" action="https://docs.google.com/forms/d/e/1FAIpQLSeKkP4HuJ5J4jW_XOrs2ryEpfSeuWn5VvbaOmMQhHKTmAxUpg/formResponse" method="POST" target="hidden_iframe">
            
            <div class="section">
                <div class="section-title">🔮 내 번호와 사주에 담긴 운명</div>
                <input type="text" id="myName" placeholder="당신의 성함 (필수)" required>
                <input type="tel" id="myPhone" placeholder="당신의 번호 (필수)" required>
                <div class="flex-row">
                    <div class="flex-item"><label>생년월일</label><input type="date" id="myBirth" required></div>
                    <div class="flex-item"><label>태어난 시간</label><input type="time" id="myTime"></div>
                </div>
                <select id="myGender"><option value="남성">남성</option><option value="여성">여성</option></select>
            </div>

            <div class="section">
                <div class="section-title">🌟 상대방의 번호와 사주에 담긴 운명</div>
                <input type="text" id="yourName" placeholder="상대방 성함 (필수)" required>
                <input type="tel" id="yourPhone" placeholder="상대방 번호 (필수)" required>
                <div class="flex-row">
                    <div class="flex-item"><label>생년월일</label><input type="date" id="yourBirth"></div>
                    <div class="flex-item"><label>태어난 시간</label><input type="time" id="yourTime"></div>
                </div>
                <label class="checkbox-group" style="margin-top: 10px;">
                    <input type="checkbox" id="birthUnknown" onchange="toggleBirth(this.checked)">
                    <span>상대방 생일 정보를 잘 모름</span>
                </label>
                <select id="yourGender"><option value="여성">여성</option><option value="남성">남성</option></select>
            </div>

            <div class="agree-container">
                <label class="checkbox-group">
                    <input type="checkbox" id="agree" onchange="toggleSubmitBtn()">
                    <span style="color: var(--light-purple);">데이터 상관관계 분석을 위한 정보 활용에 동의함 (필수)</span>
                </label>
            </div>

            <button type="button" id="submitBtn" class="btn-submit" disabled onclick="handleAnalysis()">천기누설 시작하기 ✨</button>
            
            <input type="hidden" name="entry.2059990547" id="gName">
            <input type="hidden" name="entry.669898893" id="gPhone">
            <input type="hidden" name="entry.708899075" id="gDetail">
        </form>
    </div>

    <div id="resultLayer">
        <h2 style="color: var(--star-gold); margin-bottom: 5px;">인연 분석 리포트</h2>
        <p id="resSubtitle" style="font-size: 0.9rem; color: var(--light-purple); margin-bottom: 25px;"></p>
        
        <div class="slide active" id="slide1">
            <div class="score-circle"><span id="resScore">0%</span><span class="score-label">천생연분 지수</span></div>
            <div class="analysis-card"><div class="card-sub">🔢 전화번호 수비학 분석</div><div id="numAnalysis"></div></div>
            <div class="nav-btns"><button class="btn-nav next" onclick="moveSlide(2)">사주 심층 분석 보기 →</button></div>
        </div>

        <div class="slide" id="slide2">
            <div class="analysis-card"><div class="card-sub" id="sajuTitle1"></div><div id="sajuContent1"></div></div>
            <div class="analysis-card"><div class="card-sub" id="sajuTitle2"></div><div id="sajuContent2"></div></div>
            <div class="nav-btns"><button class="btn-nav" onclick="moveSlide(1)">← 이전</button><button class="btn-nav next" onclick="moveSlide(3)">운명의 비책 보기 →</button></div>
        </div>

        <div class="slide" id="slide3">
            <div class="analysis-card" style="border-left-color: var(--star-gold);"><div class="card-sub">📍 인연의 흐름 총평</div><div id="finalReview"></div></div>
            <div class="analysis-card"><div class="card-sub">💡 관계를 빛낼 신의 한 수</div><div id="finalAdvice"></div></div>
            
            <!-- 임팩트 있는 무료 사주 응모 버튼 -->
            <button id="eventBtn" class="event-banner animate-pulse" onclick="applyEvent()">🎁 [선착순] 무료 추가 사주 분석 응모하기</button>

            <div class="share-group">
                <button class="btn-share-link" id="shareBtn" onclick="generateShareUrl()">💌 상대방 및 친구에게 결과 전송하기</button>
                <button class="btn-nav" style="background:#444;" onclick="location.href=window.location.pathname">새로 분석하기 ↩️</button>
            </div>
        </div>
    </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    function toggleBirth(val) {
        document.getElementById('yourBirth').disabled = val;
        document.getElementById('yourTime').disabled = val;
        if(val) { document.getElementById('yourBirth').value = ""; document.getElementById('yourTime').value = ""; }
    }

    function toggleSubmitBtn() {
        document.getElementById('submitBtn').disabled = !document.getElementById('agree').checked;
    }

    function moveSlide(n) {
        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
        document.getElementById('slide' + n).classList.add('active');
        window.scrollTo(0,0);
    }

    const tarotData = {
        1: { name: "Ace of Swords", text: "신비로운 1번의 에너지는 '새로운 개척과 절대적인 진실'을 상징합니다. 현재 사용하시는 번호 끝자리에는 날카로운 이성의 기운과 돌파하는 힘이 서려 있습니다. 이 인연에 있어서는 어설픈 배려보다는 명확한 대화와 결단이 가장 중요한 핵심입니다. 거짓이나 미온적인 태도는 두 분 사이의 운명을 흐리게 만들 수 있습니다. 지금 가장 시급한 것은 서로의 진심을 투명하게 드러낼 수 있는 용기입니다. 1번의 기운은 숨겨진 문제를 도려내고 새로운 시작을 알리는 검의 빛과 같습니다. 당신의 결단력이 관계의 돌파구가 될 것이며, 상대방 역시 당신의 확신에 찬 모습에서 큰 매력을 느낄 것입니다." },
        2: { name: "Two of Swords", text: "번호 끝자리 2번은 '완벽한 균형과 팽팽한 긴장'의 기운을 담고 있습니다. 현재 두 분의 관계는 마치 팽팽하게 당겨진 활시위처럼 서로의 생각 차이를 아주 정교하게 조율하는 과정에 놓여 있습니다. 중요한 선택을 앞두고 망설이고 있지는 않으신가요? 지금은 어느 한쪽이 이기려 하기보다는, 수평적인 관계를 유지하며 서로의 다름을 '있는 그대로 관찰'해야 하는 시기입니다. 서둘러 결론을 내기보다 잠시 눈을 감고 마음의 파동에 집중하세요. 평화는 고요한 침묵 속에 있으며, 서두름은 오히려 관계의 독이 됩니다. 서로를 향한 믿음의 저울이 수평을 이룰 때 인연의 꽃이 필 것입니다." },
        3: { name: "Three of Swords", text: "수비학적으로 3번은 날카로운 감수성과 '성장을 위한 아픔'을 의미합니다. 과거의 사소한 오해나 무심코 던진 일상적인 말 한마디가 상대의 가슴 깊은 곳에 가시처럼 남아 있을 가능성이 높습니다. 하지만 비가 온 뒤 땅이 더 단단해지듯, 이 감정적 흔들림은 사실 두 분이 더 깊은 영혼의 이해 단계로 넘어가기 위한 필수적인 관문입니다. 날카로운 논쟁보다는 따뜻한 포용과 먼저 건네는 진솔한 위로가 두 분의 운명적 매듭을 더욱 단단하게 묶어줄 것입니다. 상처를 진주로 만드는 힘은 오직 당신의 인내와 사랑에 달려 있습니다. 아픔을 공유하는 순간 사랑은 완성됩니다." },
        4: { name: "Four of Swords", text: "번호 끝자리 4번은 '지혜로운 휴식과 내외면의 재정비'를 뜻합니다. 쉬지 않고 달려오기만 했던 관계에 있어 지금 가장 필요한 것은 서로의 물리적, 정서적인 공간입니다. 관계가 소원해진 것이 아니라, 더 큰 도약을 위해 각자의 에너지를 채워야 할 시점임을 하늘이 알려주고 있습니다. 명상이나 조용한 취미를 별개로 즐기거나, 잠시 대화를 멈추고 서로의 존재를 정적으로 느끼는 시간을 가져보세요. 내일의 커다란 사랑을 위해 오늘의 칼을 잠시 내려놓는 지혜가 필요합니다. 멈춤은 곧 전진의 준비이며, 이 휴식기가 지나면 두 분의 대화는 전보다 훨씬 깊어질 것입니다." },
        5: { name: "Five of Swords", text: "5번의 기운은 '강력한 자존심의 격돌과 변화'를 예고합니다. 두 분 모두 자기 색깔이 뚜렷하고 개성이 강하다 보니 사소한 일에서도 주도권을 놓지 않으려는 마음이 앞설 수 있습니다. 하지만 기억하세요. 진정한 관계의 승리는 상대를 굴복시키는 것이 아니라, 내 안의 상처받은 이기심을 꺾고 상대의 품에 온전히 안기는 것입니다. 한 걸음 물러나 주는 것이 진정으로 인연의 줄기를 장악하는 현명한 길입니다. 소모적인 기싸움을 멈추고 함께 바라보고 있는 먼 미래의 공동 목표에 집중하시길 바랍니다. 승자 없는 소모전을 멈출 열쇠는 오직 배려뿐입니다." },
        6: { name: "Six of Swords", text: "6번은 '안식처를 향한 순조로운 항해'를 뜻하는 매우 길한 신호입니다. 최근 어려운 고비를 넘겼거나 심리적인 불안함이 있었다면 이제는 평화롭고 안정적인 시기로 접어드는 입구에 서 계십니다. 당신이 사용하는 번호는 주변인의 도움이나 예상치 못한 환경의 변화가 두 분의 관계를 긍정적인 방향으로 이끌어 줄 것임을 암시합니다. 과거의 아픔에 얽매이기보다 함께 여행을 떠나거나 새로운 공부를 시작하는 것이 인연의 불길을 다시 지필 것입니다. 믿고 노를 저어가세요. 당신이 도달할 곳은 풍요롭고 고요하며 햇살이 가득한 행복의 섬입니다." },
        7: { name: "Seven of Swords", text: "번호 7번은 '기민한 지혜와 신비로운 매력'을 상징합니다. 모든 것을 투명하게 보여주는 것도 좋지만, 때로는 적절한 비밀과 지적인 밀당이 드라마틱한 관계의 생명력을 연장시킵니다. 당신의 매력은 쉽게 정복되지 않는 신비로움과 영민함에서 나옵니다. 상대방에게 모든 패를 한꺼번에 보여주지 마세요. 가끔은 의외의 장소에서의 만남이나 생각지 못한 작은 이벤트를 통해 상대의 호기심을 끊임없이 자극해야 합니다. 당신만의 지적인 게임에 상대를 초대하여 관계의 활력을 불어넣으세요. 신비로움은 인연의 유통기한을 영원하게 만드는 강력한 비법입니다." },
        8: { name: "Eight of Swords", text: "8번의 번호를 가진 분은 스스로를 가두고 있는 '마인드의 감옥'을 가장 경계해야 합니다. 상대가 나를 오해하지 않을까 봐, 혹은 나중에 상처받을까 봐 미리 방어벽을 높게 쌓고 있지는 않나요? 사실 그 감옥의 열쇠는 이미 당신의 손에 쥐어져 있습니다. 두려움의 눈가리개를 벗고 현실을 직시하세요. 상대방은 당신이 생각하는 것보다 훨씬 더 넓은 가슴과 포용력을 준비하고 있습니다. 스스로를 묶고 있는 밧줄은 사실 아주 느슨하게 풀려 있습니다. 당신이 자유로워질 때 두 분의 운명은 비로소 막힘 없이 흐르게 될 것입니다." },
        9: { name: "Nine of Swords", text: "9번은 '심리적 압박과 과도한 번뇌'의 수입니다. 밤잠을 설치며 상대방의 행동 하나하나, 말투 하나하나에 과도한 의미를 부여하고 계신다면 그것은 번호가 주는 부정적인 파동에 휘말린 것입니다. 고민의 90% 이상은 현실에서 결코 일어나지 않을 허상에 불과합니다. 마음의 짐을 지금 당장 내려놓으세요. 오히려 직접적으로 본인의 불안함을 솔직하고 담백하게 털어놓는 순간, 그 모든 어둠은 아침 해와 함께 안개처럼 사라질 것입니다. 현재의 즐거운 순간에만 집중해도 충분히 아름다운 인연입니다. 걱정으로 시간을 낭비하기엔 당신의 사랑이 너무 귀합니다." },
        0: { name: "Ten of Swords", text: "0번(수비학의 10)은 '완성이자 새로운 차원으로의 비상'을 뜻합니다. 당신은 지금 어쩌면 관계의 한계를 느끼거나 막다른 길에 서 있을지 모르지만, 이는 곧 새로운 햇살이 비치기 직전의 가장 어두운 새벽임을 알려줍니다. 낡은 연애 방식이나 불필요한 고집, 해묵은 감정을 완전히 불태워 버려야 할 때입니다. 과거를 완전히 매듭짓고 새롭게 다시 태어나는 기운이 강하게 들어와 있습니다. 고통스러운 변화 뒤에는 반드시 눈부신 환희와 보상이 따르는 법입니다. 이제 다시 비상할 일만 남았습니다. 바닥을 찍었으니 이제 하늘로 올라갈 일뿐입니다. 희망을 가지세요." }
    };

    function getSajuDesc(name, birth, time, gender, pLast) {
        if(!birth) return `상대방의 구체적인 생시 정보가 신비에 가려져 있으나, 번호 끝자리 ${pLast}번의 수비학적 파동만으로 보아 상대는 본인의 본심을 쉽게 허락하지 않으면서도 한 번 사랑의 확신을 느끼면 자신의 모든 것을 내던질 만큼 깊이 몰입하는 강렬한 성향의 소유자입니다. 천문의 기운은 정적인 만남보다 동적인 환경에서 인연의 에너지가 더욱 큰 공명을 일으킬 것임을 암시합니다.`;
        const month = parseInt(birth.split('-')[1]);
        let mText = "", pText = "", eText = "";
        
        if([3,4,5].includes(month)) {
            mText = `${name}님은 만물이 소생하며 대지를 뚫고 올라오는 강력한 생명력의 봄, 곧게 뻗어 나가는 '목(木)'의 정기를 천성적으로 타고났습니다. `;
            pText = `성격적으로는 마치 거대한 숲의 중심을 지키는 소나무처럼 강직하면서도 타인을 포용하는 따뜻한 리더십을 동시에 갖추고 있습니다. 사랑에 있어서도 가식적인 태도보다는 투박하더라도 진실함을 제1의 가치로 여기며, 한 번 맺은 인연은 비바람이 몰아쳐도 결코 흔들리지 않는 뿌리 깊은 충직함을 보여줍니다. 주변을 정화하는 맑은 에너지가 당신의 매력 포인트입니다. `;
            eText = `다만, 나무는 너무 강하기만 하면 폭풍우에 부러질 위험이 있습니다. 상대방에게 당신의 높은 도덕적 기준을 강요하기보다 때로는 흐르는 물과 같은 유연함과 부드러운 갈대와 같은 포용력을 발휘해 보세요. 당신의 강직함에 유연함이 더해지는 순간, 상대방은 영원히 당신이라는 그늘 아래 머물고 싶어 할 것입니다.`;
        } else if([6,7,8].includes(month)) {
            mText = `${name}님은 작열하는 여름 태양 아래 맹렬히 타오르는 '화(火)' 기운을 지닌, 그 누구보다 찬란하고 열정적인 영혼의 소유자입니다. `;
            pText = `당신은 존재 자체만으로도 주변의 어둠을 밝히고 에너지를 충전시켜주는 빛나는 아우라를 가졌습니다. 솔직담백하고 뒤끝 없는 성격 덕에 이성에게 늘 선망의 대상이 되며, 사랑에 빠지는 순간 그 어떤 장애물도 두려워하지 않고 연인을 향해 돌진하는 뜨거운 로맨티스트입니다. 당신의 감정 표현은 가공되지 않은 다이아몬드처럼 순수하고 강력합니다. `;
            eText = `하지만 불은 연료가 떨어지거나 관심이 식으면 금방 차가워질 조심성이 필요합니다. 단순히 육체적인 열정을 넘어 정서적인 깊은 교감과 지적인 대화를 통해 사랑의 온도를 꾸준히 유지하는 것이 인연을 지키는 핵심 비책입니다. 감정의 급격한 물살에 휘말려 성급한 판단을 내리지 않도록 마음의 중심을 잘 잡으세요. 당신의 열정은 곧 인연의 동력입니다.`;
        } else if([9,10,11].includes(month)) {
            mText = `${name}님은 모든 만물이 결실을 맺는 수확의 계절, 냉철하면서도 가장 단단한 보석과 같은 '금(金)'의 정기를 타고난 분입니다. `;
            pText = `옳고 그름이 명확하며, 한 입으로 두말하는 법이 없는 정의로운 성품의 소유자입니다. 연애에 있어서도 얄팍한 밀당이나 눈속임보다는 상호 간의 절대적인 신뢰와 예의를 최우선 가치로 생각합니다. 겉모습은 차갑고 예리한 칼날 같아 보일지 몰라도, 그 속은 그 누구보다 귀하고 순수한 황금과 같은 따스함과 정을 품고 있는 츤데레적인 매력이 가득합니다. `;
            eText = `단단한 금속은 뜨거운 담금질을 거쳐야만 비로소 신비로운 형태를 갖춘 보석이 됩니다. 상대를 이성적으로 판단하기에 앞서, 당신이 품고 있는 풍부하고 따뜻한 감수성을 조금 더 겉으로 드러내 표현해 보세요. 차가운 이성에 따스한 배려 한 방울이 섞이는 순간, 당신의 인연은 영원히 변치 않는 다이아몬드처럼 찬란하게 빛날 것입니다.`;
        } else {
            mText = `${name}님은 끝을 알 수 없는 깊은 바다와 같이 무궁무진한 지혜를 품은 겨울의 '수(수)' 기운을 상징하는 영혼입니다. `;
            pText = `어떤 그릇에도 담길 수 있는 유연한 사고방식과 상대의 마음속 깊은 바닥까지 읽어내는 탁월한 직관력을 타고났습니다. 조용히 뒤에서 연인을 서포트하며 결정적인 고비마다 현명한 해결책을 제시하는 당신은 상대방에게 있어 세상 그 무엇보다 든든하고 평온한 안식처이자 등대와 같은 존재입니다. 당신의 고요한 관찰력은 관계의 위험을 미연에 방지합니다. `;
            eText = `다만, 흐르지 않고 고여 있는 물은 쉽게 차가워집니다. 마음속 깊이 담아둔 서운함이나 진실된 고민을 혼자서만 삭히지 말고 강물처럼 밖으로 흐르게 하세요. 당신이 먼저 마음의 빗장을 열고 투명하게 소통할 때, 두 사람의 관계는 끝없이 깊고 푸른 바다처럼 풍요롭고 생명력 넘치는 대서사시를 써 내려갈 수 있을 것입니다.`;
        }
        return mText + pText + eText + `\n\n특히 태어난 시각(${time || '미상'})의 기운이 올해의 천문 흐름과 절묘하게 공명하고 있어, 현재 '${gender=='여성'?'연애운':'애정운'}'의 에너지가 평생에 한 번 올까 말까 한 강력한 전성기를 맞이하고 있습니다.`;
    }

    let cachedData = null;

    function handleAnalysis() {
        const n1 = document.getElementById('myName').value.trim();
        const p1Raw = document.getElementById('myPhone').value.replace(/[^0-9]/g, '');
        const b1 = document.getElementById('myBirth').value;
        const n2 = document.getElementById('yourName').value.trim();
        const p2Raw = document.getElementById('yourPhone').value.replace(/[^0-9]/g, '');
        const b2 = document.getElementById('yourBirth').value;
        const unknown = document.getElementById('birthUnknown').checked;

        if(!n1 || !p1Raw || !b1 || !n2 || !p2Raw) { alert("⚠️ 모든 항목을 채워주세요!"); return; }
        if(p1Raw.length !== 11 || p2Raw.length !== 11) { alert("⚠️ 번호 11자리를 정확히 입력해주세요."); return; }
        if(!unknown && !b2) { alert("⚠️ 상대방 생일을 입력해주세요."); return; }

        const d = {
            n1, p1: p1Raw, b1, t1: document.getElementById('myTime').value, g1: document.getElementById('myGender').value,
            n2, p2: p2Raw, b2, t2: document.getElementById('yourTime').value, g2: document.getElementById('yourGender').value,
            event: "미응모"
        };
        cachedData = d;
        sendToGoogle(d);
        showResult(d);
    }

    function sendToGoogle(d) {
        document.getElementById('gName').value = d.n1 + " | " + d.n2;
        document.getElementById('gPhone').value = d.p1 + " | " + d.p2;
        document.getElementById('gDetail').value = `상태:${d.event} | 정보:${JSON.stringify(d)}`;
        document.getElementById('loveForm').submit();
    }

    function applyEvent() {
        if(!cachedData) return;
        cachedData.event = "무료 사주 응모 완료";
        sendToGoogle(cachedData);
        alert("✨ 응모가 완료되었습니다! \n 추첨을 통해 연락드리겠습니다.");
        const btn = document.getElementById('eventBtn');
        btn.innerText = "✅ 응모 완료 (우주의 기운이 함께 하는 중)";
        btn.classList.remove('animate-pulse');
        btn.style.background = "#bdc3c7";
        btn.onclick = null;
    }

    function showResult(d) {
        document.getElementById('inputLayer').style.display = 'none';
        document.getElementById('resultLayer').style.display = 'block';
        document.getElementById('resSubtitle').innerText = `${d.n1} 님과 ${d.n2} 님의 천문 공명 리포트`;

        const p1Last = parseInt(d.p1.slice(-1)) || 0;
        const p2Last = parseInt(d.p2.slice(-1)) || 0;

        document.getElementById('numAnalysis').innerHTML = `<div style='margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;'><strong>[${d.n1}님]</strong><br>${tarotData[p1Last].text}</div><div><strong>[${d.n2}님]</strong><br>${tarotData[p2Last].text}</div>`;
        document.getElementById('sajuTitle1').innerText = `🌙 ${d.n1}님의 운명 성향`;
        document.getElementById('sajuContent1').innerText = getSajuDesc(d.n1, d.b1, d.t1, d.g1, p1Last);
        document.getElementById('sajuTitle2').innerText = `✨ ${d.n2}님의 운명 성향`;
        document.getElementById('sajuContent2').innerText = getSajuDesc(d.n2, d.b2, d.t2, d.g2, p2Last);

        let score = 75 + (p1Last % 4) * 3 + (p2Last % 4) * 4;
        if(p1Last === p2Last) score += 10;
        if(score > 99) score = 99;
        document.getElementById('resScore').innerText = score + "%";

        document.getElementById('finalReview').innerText = `두 사람의 결합 에너지는 '${score}%'라는 놀라운 동조율을 기록하고 있습니다. 이는 단순한 우연을 넘어 서로가 서로의 부족한 운명적 조각을 채워주는 '상승 기류형 인연'임을 강력하게 시사합니다. 처음 만났을 때 느꼈던 그 묘한 익숙함과 편안함은 전생에서부터 이어져 온 인연의 끈이 다시금 매듭지어진 결과입니다. 현재 두 분 사이에 존재하는 약간의 시각 차이는 오히려 관계를 풍부하게 만들어주는 양념과도 같습니다. 서로의 눈동자 속에서 자신의 가장 아름답고 고귀한 모습을 발견하게 될 것이며, 시간이 흐를수록 그 가치는 더욱 깊어질 것입니다.`;
        
        document.getElementById('finalAdvice').innerText = `1. [운명의 공진 장소]: 물이 보이는 고요한 카페나 큰 나무가 울창한 숲길을 손잡고 걸으며 대화하세요. 도시의 소음에서 벗어날수록 두 분의 정신 에너지는 맑게 정화됩니다.\n\n2. [주의해야 할 언령]: 두 분 모두 번호에 서린 예리한 검(Sword)의 자취가 있어 자칫하면 '충고'라는 이름의 비수가 상대의 마음에 상처를 줄 수 있습니다. 정답을 제시하려 하기보다 상대의 감정을 먼저 따뜻하게 물어봐 주는 감성적 지혜가 필요합니다.\n\n3. [화합의 성좌 의식]: 매주 일요일 밤, 잠들기 전 서로에게 고마웠던 점 세 가지를 따뜻하게 말해주세요. 수비학적으로 흩어지기 쉬운 기운을 하나로 모아 영원한 사랑을 약속하는 가장 강력한 수호 비책이 될 것입니다.`;
    }

    function generateShareUrl() {
        if(!cachedData) return;
        const encoded = btoa(encodeURIComponent(JSON.stringify(cachedData)));
        const url = window.location.origin + window.location.pathname + "?res=" + encoded;
        const dummy = document.createElement("input");
        document.body.appendChild(dummy);
        dummy.value = url;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        const btn = document.getElementById('shareBtn');
        btn.innerText = "✅ 링크 복사 완료!";
        btn.style.background = "#00b894";
        alert("분석 링크가 복사되었습니다! ✨");
    }

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const resHash = urlParams.get('res');
        if(resHash) {
            try {
                const data = JSON.parse(decodeURIComponent(atob(resHash)));
                showResult(data);
                const sBtn = document.getElementById('shareBtn');
                sBtn.innerText = "🌀 나도 인연 분석해보기";
                sBtn.onclick = () => location.href = window.location.pathname;
                document.getElementById('eventBtn').style.display = 'none';
            } catch(e) { console.error("URL Data Error"); }
        }
    }
</script>
</body>
</html>
