<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ 신비로운 인연 분석기 ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <style>
    :root {
      --mystic-purple: #6e57e0;
      --light-purple: #decaff;
      --deep-purple: #2a1b5d;
      --star-gold: #fff9c4;
      --bg-night: #1a1a2e;
    }
    body { font-family: 'Jua', sans-serif; background: var(--bg-night); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }

    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #2a1b5d 0%, #1a1a2e 100%);
      z-index: -1;
    }

    .container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 520px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { text-align: center; color: var(--light-purple); text-shadow: 0 0 10px var(--mystic-purple); margin-bottom: 30px; }

    .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid var(--mystic-purple); margin-bottom: 20px; }
    .section-title { color: var(--star-gold); margin-bottom: 15px; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }

    label { display: block; font-size: 0.85rem; color: var(--light-purple); margin-bottom: 5px; margin-left: 5px; }
    input, select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(0,0,0,0.3); color: white; margin-bottom: 12px; font-family: 'Jua'; box-sizing: border-box; font-size: 1rem; }

    .flex-row { display: flex; gap: 10px; align-items: flex-end; }
    .flex-item { flex: 1; }

    .checkbox-group { display: flex; align-items: center; font-size: 0.85rem; gap: 8px; color: #ccc; margin-bottom: 6px; cursor: pointer; }

    .agree-container { background: rgba(0,0,0,0.25); padding: 12px; border-radius: 12px; margin-bottom: 10px; }

    .btn-submit { width: 100%; padding: 18px; background: linear-gradient(45deg, var(--mystic-purple), #a29bfe); color: white; border: none; border-radius: 20px; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 15px rgba(110, 87, 224, 0.4); transition: 0.3s; }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

    #resultLayer { display: none; text-align: center; }
    .slide { display: none; animation: fadeIn 0.6s ease-out; text-align: left; }
    .slide.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 5px solid var(--star-gold); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 2.8rem; margin: 0 auto 25px; color: var(--star-gold); background: rgba(0,0,0,0.3); box-shadow: 0 0 25px rgba(255, 249, 196, 0.2); }
    .score-label { font-size: 0.9rem; margin-top: -5px; opacity: 0.8; }

    .analysis-card { background: rgba(255,255,255,0.07); padding: 22px; border-radius: 22px; border-left: 5px solid var(--mystic-purple); margin-bottom: 20px; line-height: 1.9; font-size: 0.98rem; color: #f0f0f0; white-space: pre-wrap; word-break: keep-all; }
    .card-sub { color: var(--star-gold); font-size: 1.15rem; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; font-weight: bold; }

    .nav-btns { display: flex; gap: 10px; margin-top: 25px; }
    .btn-nav { flex: 1; padding: 15px; border-radius: 15px; border: 1px solid var(--mystic-purple); background: rgba(110, 87, 224, 0.15); color: white; cursor: pointer; font-family: 'Jua'; font-size: 1.1rem; }
    .btn-nav.next { background: var(--mystic-purple); }

    .share-group { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 30px; }
    .btn-share-link { background: linear-gradient(45deg, #ff7675, #ef5777); color: white; border: none; padding: 20px; border-radius: 20px; font-size: 1.3rem; font-family: 'Jua'; cursor: pointer; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

<div class="container">
  <div id="inputLayer">
    <h1>✨ 운명의 성좌 분석 ✨</h1>
    <form id="loveForm" action="https://docs.google.com/forms/d/e/1FAIpQLSeKkP4HuJ5J4jW_XOrs2ryEpfSeuWn5VvbaOmMQhHKTmAxUpg/formResponse" method="POST" target="hidden_iframe">
      <!-- 나의 정보 -->
      <div class="section">
        <div class="section-title">🔮 나의 성좌</div>
        <input type="text" id="myName" placeholder="당신의 성함 (필수)" required />
        <input type="tel" id="myPhone" placeholder="휴대폰 번호 (01012345678) (필수)" required />
        <div class="flex-row">
          <div class="flex-item"><label>생년월일</label><input type="date" id="myBirth" required /></div>
          <div class="flex-item"><label>태어난 시간</label><input type="time" id="myTime" /></div>
        </div>
        <select id="myGender"><option value="남성">남성</option><option value="여성">여성</option></select>
      </div>

      <!-- 상대방 정보 -->
      <div class="section">
        <div class="section-title">🌟 상대의 성좌</div>
        <input type="text" id="yourName" placeholder="상대방 성함 (필수)" required />
        <input type="tel" id="yourPhone" placeholder="상대방 번호 (필수)" required />
        <div class="flex-row">
          <div class="flex-item"><label>생년월일</label><input type="date" id="yourBirth" /></div>
          <div class="flex-item"><label>태어난 시간</label><input type="time" id="yourTime" /></div>
        </div>
        <label class="checkbox-group" style="margin-top: 6px;">
          <input type="checkbox" id="birthUnknown" onchange="toggleBirth(this.checked)">
          상대방 생일 정보를 잘 모름
        </label>
        <select id="yourGender"><option value="여성">여성</option><option value="남성">남성</option></select>
      </div>

      <!-- 동의 및 응모 -->
      <div class="agree-container">
        <label class="checkbox-group">
          <input type="checkbox" id="agree" onchange="toggleSubmitBtn()">
          데이터 상관관계 분석을 위한 정보 활용에 동의함 (필수)
        </label>
        <label class="checkbox-group">
          <input type="checkbox" id="eventAgree">
          무료 추가 사주 분석 응모 (선택)
        </label>
      </div>

      <button type="button" id="submitBtn" class="btn-submit" disabled onclick="handleAnalysis()">천기누설 시작하기 ✨</button>

      <input type="hidden" name="entry.2059990547" id="gName" />
      <input type="hidden" name="entry.669898893" id="gPhone" />
      <input type="hidden" name="entry.708899075" id="gDetail" />
    </form>
  </div>

  <!-- 결과 리포트 섹션 -->
  <div id="resultLayer">
    <h2 style="color: var(--star-gold); margin-bottom: 5px;">인연 분석 리포트</h2>
    <p id="resSubtitle" style="font-size: 0.9rem; color: var(--light-purple); margin-bottom: 25px;"></p>

    <div class="slide active" id="slide1">
      <div class="score-circle">
        <span id="resScore">0%</span>
        <span class="score-label">천생연분 지수</span>
      </div>
      <div class="analysis-card">
        <div class="card-sub">🔢 전화번호 수비학 분석</div>
        <div id="numAnalysis"></div>
      </div>
      <div class="nav-btns">
        <button class="btn-nav next" onclick="moveSlide(2)">사주 심층 분석 보기 →</button>
      </div>
    </div>

    <div class="slide" id="slide2">
      <div class="analysis-card">
        <div class="card-sub" id="sajuTitle1"></div>
        <div id="sajuContent1"></div>
      </div>
      <div class="analysis-card">
        <div class="card-sub" id="sajuTitle2"></div>
        <div id="sajuContent2"></div>
      </div>
      <div class="nav-btns">
        <button class="btn-nav" onclick="moveSlide(1)">← 이전</button>
        <button class="btn-nav next" onclick="moveSlide(3)">운명의 비책 보기 →</button>
      </div>
    </div>

    <div class="slide" id="slide3">
      <div class="analysis-card" style="border-left-color: var(--star-gold);">
        <div class="card-sub">📍 인연의 흐름 총평</div>
        <div id="finalReview" style="font-size:1.05rem;"></div>
      </div>
      <div class="analysis-card">
        <div class="card-sub">💡 관계를 빛낼 신의 한 수</div>
        <div id="finalAdvice"></div>
      </div>

      <div class="share-group">
        <button class="btn-share-link" id="shareBtn" onclick="generateShareUrl()">💌 상대방에게 결과 전송하기</button>
        <button class="btn-nav" style="background:#444;" onclick="location.href=window.location.pathname">새로 분석하기 ↩️</button>
      </div>
    </div>
  </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
  // 상대방 생일 입력창 제어
  function toggleBirth(val) {
    document.getElementById('yourBirth').disabled = val;
    document.getElementById('yourTime').disabled = val;
    if(val) {
      document.getElementById('yourBirth').value = "";
      document.getElementById('yourTime').value = "";
    }
  }

  // 분석하기 버튼 활성화 제어
  function toggleSubmitBtn() {
    const agree = document.getElementById('agree').checked;
    document.getElementById('submitBtn').disabled = !agree;
  }

  // 전화번호 포맷 정리 및 검증 도우미
  function sanitizePhone(raw) {
    return (raw || "").toString().replace(/[^0-9]/g, "");
  }
  function isValidPhone13Digits(phone) {
    // 11자리 숫자여야 함: 예) 01012345678
    return typeof phone === "string" && /^\d{11}$/.test(phone);
  }

  // 확장형 타로 수비학 데이터 (필요 시 확장 가능)
  const tarotData = {
    1: { name: "Ace of Swords", text: "신비로운 1번의 에너지는 '개척과 진실'을 상징합니다. ..." },
    2: { name: "Two of Swords", text: "번호 끝자리 2번은 '균형과 긴장'의 기운..." },
    // 필요한 경우 나머지 3~9,0도 동일하게 확장
  };

  // 사주 분석 텍스트 생성 (확장형)
  function getSajuDesc(name, birth, time, gender, pLast) {
    // birth가 없으면 간략 설명 반환
    if(!birth) return `상대방의 구체적인 생시 정보가 신비에 가려져 있으나, 번호 끝자리 ${pLast}번의 수비학적 파동만으로도 강력한 인력을 느낄 수 있습니다.`;
    // 실제 로직은 이전 버전의 상세 텍스트를 사용하되, 길이가 길고 풍성하게 구성해 두면 됨
    // 아래는 예시 축약본
    const month = parseInt(birth.split('-')[1]);
    let intro = "", body = "", energy = "";
    if([3,4,5].includes(month)) {
      intro = `${name}님은 봄의 기운... `;
      body = `성격은... `;
      energy = `또한... `;
    } else if([6,7,8].includes(month)) {
      intro = `${name}님은 여름의 기운... `;
      body = `성격은... `;
      energy = `지속적인 소통이 핵심... `;
    } else if([9,10,11].includes(month)) {
      intro = `${name}님은 가을의 기운... `;
      body = `성격은... `;
      energy = `포용력이 필요... `;
    } else {
      intro = `${name}님은 겨울의 기운... `;
      body = `성격은... `;
      energy = `표현의 중요성... `;
    }
    return intro + body + energy + `\n\n특히 태어난 시각(${time || '미상'})의 기운이 올해의 천문 흐름과 공명하여 '${gender=='여성'?'연애운':'애정운'}'의 에너지가 강력하게 활성화된 상태입니다.`;
  }

  // 분석하기 버튼 클릭 핸들러: 입력 검증 및 데이터 전송
  function handleAnalysis() {
    const n1 = (document.getElementById('myName').value || "").trim();
    const p1Raw = sanitizePhone(document.getElementById('myPhone').value);
    const b1 = document.getElementById('myBirth').value;
    const t1 = document.getElementById('myTime').value;
    const g1 = document.getElementById('myGender').value;

    const n2 = (document.getElementById('yourName').value || "").trim();
    const p2Raw = sanitizePhone(document.getElementById('yourPhone').value);
    const b2 = document.getElementById('birthUnknown').checked ? "" : (document.getElementById('yourBirth').value || "");
    const t2 = document.getElementById('yourTime').value;
    const g2 = document.getElementById('yourGender').value;
    const birthUnknown = document.getElementById('birthUnknown').checked;

    // 필수값 체크
    if(!n1 || !p1Raw || !b1 || !n2 || !p2Raw) {
      alert("⚠️ 비어있는 항목을 확인해주세요! 성함, 전화번호, 생년월일은 필수 입력입니다.");
      console.error("Validation: Missing required fields", { n1, p1Raw, b1, n2, p2Raw });
      return;
    }

    // 전화번호 형식 검증
    if(!isValidPhone13Digits(p1Raw) || !isValidPhone13Digits(p2Raw)) {
      alert("⚠️ 전화번호 형식이 올바르지 않습니다. 01012345678 형태의 11자리 숫자를 입력해주세요.");
      console.error("Validation: Invalid phone format", { p1Raw, p2Raw });
      return;
    }

    // 상대방 생년월일 필수 여부 체크
    if(!birthUnknown && !b2) {
      alert("⚠️ 상대방의 생년월일을 입력하시거나 '상대방 정보 모름'을 선택해 주세요.");
      console.error("Validation: Missing 상대방 birth when not marked unknown");
      return;
    }

    // 데이터 구성
    const d = {
      n1, p1: p1Raw, b1, t1, g1,
      n2, p2: p2Raw, b2, t2, g2,
      event: document.getElementById('eventAgree').checked ? "응모함" : "미응모"
    };

    // Google Form 전송용 값 설정
    document.getElementById('gName').value = `${d.n1} | ${d.n2}`;
    document.getElementById('gPhone').value = `${d.p1} | ${d.p2}`;
    document.getElementById('gDetail').value = JSON.stringify(d);

    document.getElementById('loveForm').submit(); // 폼 전송(비동기 취급)
    // 결과 렌더링
    cachedData = d;
    showResult(d);
  }

  // 결과 렌더링
  function showResult(d) {
    document.getElementById('inputLayer').style.display = 'none';
    document.getElementById('resultLayer').style.display = 'block';
    document.getElementById('resSubtitle').innerText = `${d.n1} 님과 ${d.n2} 님의 천문 공명 리포트`;

    const p1Last = parseInt(d.p1.slice(-1)) || 0;
    const p2Last = parseInt(d.p2.slice(-1)) || 0;

    // 간단 텍스트를 확장 가능한 영역으로 넣습니다.
    document.getElementById('numAnalysis').innerHTML = `
      <div style="margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
        <strong>[${d.n1}님]</strong><br>${tarotData[p1Last]?.text || "텍스트 미확인"}
      </div>
      <div><strong>[${d.n2}님]</strong><br>${tarotData[p2Last]?.text || "텍스트 미확인"}</div>
    `;

    document.getElementById('sajuTitle1').innerText = `🌙 ${d.n1}님의 운명 성향`;
    document.getElementById('sajuContent1').innerText = getSajuDesc(d.n1, d.b1, d.t1, d.g1, p1Last);
    document.getElementById('sajuTitle2').innerText = `✨ ${d.n2}님의 운명 성향`;
    document.getElementById('sajuContent2').innerText = getSajuDesc(d.n2, d.b2, d.t2, d.g2, p2Last);

    let score = 75 + (p1Last % 4) * 3 + (p2Last % 4) * 3;
    if(p1Last === p2Last) score += 10;
    if(score > 99) score = 99;
    document.getElementById('resScore').innerText = score + "%";

    document.getElementById('finalReview').innerText = `두 사람의 결합 에너지는 '${score}%'라는 놀라운 동조율을 기록하고 있습니다. ...
      이 인연은 서로의 단점을 지워주고 장점을 증폭시키는 상승 기류형 인연으로 묘사됩니다. 처음 만났을 때의 낯선 친밀감은 시간이 흐를수록 심화되며, 서로의 가치관 차이가 오히려 관계를 풍부하게 만들어 줍니다. 미래를 함께 설계하는 데 있어 두 분의 시너지는 상당히 강력하다고 할 수 있습니다.`;
    
    document.getElementById('finalAdvice').innerText = `1. [운명의 공진 장소]: 물이 보이는 조용한 카페나 큰 나무가 울창한 숲길에서 대화하세요. 마음의 피로가 씻겨 내려갑니다.
2. [주의해야 할 언령]: 검(Sword)의 기운이 강해 지나친 충고가 상처가 될 수 있습니다. 상대의 감정을 먼저 확인하고 말하는 습관을 들이세요.
3. [화합의 성좌 의식]: 매주 고마운 점 3가지를 서로 말하는 시간을 가지면 기운이 하나로 모입니다.`;

    // 선택 항목에 따라 결과 페이지에서의 구성 도와주기
    // (추가 로직 필요 시 여기에 구현)
  }

  function generateShareUrl() {
    if(!window.cachedData) {
      // 저장되지 않았으면 경고
      alert("먼저 분석을 완료하고 데이터를 저장해 주세요.");
      return;
    }
    const encoded = btoa(encodeURIComponent(JSON.stringify(window.cachedData)));
    const url = window.location.origin + window.location.pathname + "?res=" + encoded;
    const dummy = document.createElement("input");
    document.body.appendChild(dummy);
    dummy.value = url;
    dummy.select();
    document.execCommand("copy");
    document.body.removeChild(dummy);
    const btn = document.getElementById('shareBtn');
    btn.innerText = "✅ 공유 링크 복사 완료!";
    btn.style.background = "#00b894";
    alert("분석 링크가 복사되었습니다! 상대방에게 전달해 두 사람의 결과를 공유하세요. ✨");
  }

  let cachedData = null;
  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const resHash = urlParams.get('res');
    if(resHash) {
      try {
        const data = JSON.parse(decodeURIComponent(atob(resHash)));
        cachedData = data;
        showResult(data);
        const sBtn = document.getElementById('shareBtn');
        sBtn.innerText = "🌀 나도 인연 분석해보기";
        sBtn.onclick = () => location.href = window.location.pathname;
      } catch(e) {
        console.error("URL 데이터 해독 실패", e);
      }
    }
  }
</script>
</body>
</html>
