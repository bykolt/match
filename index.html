<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 신비로운 인연 분석기 ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --mystic-purple: #6e57e0;
            --light-purple: #decaff;
            --deep-purple: #2a1b5d;
            --star-gold: #fff9c4;
            --bg-night: #1a1a2e;
        }
        body { font-family: 'Jua', sans-serif; background: var(--bg-night); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #2a1b5d 0%, #1a1a2e 100%);
            z-index: -1;
        }

        .container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: var(--light-purple); text-shadow: 0 0 10px var(--mystic-purple); margin-bottom: 30px; }
        
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid var(--mystic-purple); margin-bottom: 20px; }
        .section-title { color: var(--star-gold); margin-bottom: 15px; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        
        label { display: block; font-size: 0.85rem; color: var(--light-purple); margin-bottom: 5px; margin-left: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(0,0,0,0.3); color: white; margin-bottom: 12px; font-family: 'Jua'; box-sizing: border-box; font-size: 1rem; }
        
        .flex-row { display: flex; gap: 10px; align-items: flex-end; }
        .flex-item { flex: 1; }
        
        .checkbox-group { display: flex; align-items: center; font-size: 0.85rem; gap: 8px; color: #ccc; margin-bottom: 10px; cursor: pointer; }
        .checkbox-group input { width: auto; margin: 0; cursor: pointer; }

        .agree-container { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin-bottom: 20px; }

        .btn-submit { width: 100%; padding: 18px; background: linear-gradient(45deg, var(--mystic-purple), #a29bfe); color: white; border: none; border-radius: 20px; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 15px rgba(110, 87, 224, 0.4); transition: 0.3s; }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        #resultLayer { display: none; text-align: center; }
        .slide { display: none; animation: fadeIn 0.6s ease-out; text-align: left; }
        .slide.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 5px solid var(--star-gold); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 2.8rem; margin: 0 auto 25px; color: var(--star-gold); background: rgba(0,0,0,0.3); box-shadow: 0 0 25px rgba(255, 249, 196, 0.2); }
        .score-label { font-size: 0.9rem; margin-top: -5px; opacity: 0.8; }
        
        .analysis-card { background: rgba(255,255,255,0.07); padding: 22px; border-radius: 22px; border-left: 5px solid var(--mystic-purple); margin-bottom: 20px; line-height: 1.9; font-size: 0.98rem; color: #f0f0f0; white-space: pre-wrap; word-break: keep-all; }
        .card-sub { color: var(--star-gold); font-size: 1.15rem; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; font-weight: bold; }

        .nav-btns { display: flex; gap: 10px; margin-top: 25px; }
        .btn-nav { flex: 1; padding: 15px; border-radius: 15px; border: 1px solid var(--mystic-purple); background: rgba(110, 87, 224, 0.15); color: white; cursor: pointer; font-family: 'Jua'; font-size: 1.1rem; }
        .btn-nav.next { background: var(--mystic-purple); }
        
        .share-group { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 30px; }
        .btn-share-link { background: linear-gradient(45deg, #ff7675, #ef5777); color: white; border: none; padding: 20px; border-radius: 20px; font-size: 1.3rem; font-family: 'Jua'; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <div id="inputLayer">
        <h1>✨ 운명의 성좌 분석 ✨</h1>
        <form id="loveForm" action="https://docs.google.com/forms/d/e/1FAIpQLSeKkP4HuJ5J4jW_XOrs2ryEpfSeuWn5VvbaOmMQhHKTmAxUpg/formResponse" method="POST" target="hidden_iframe">
            
            <!-- 나의 정보 -->
            <div class="section">
                <div class="section-title">🔮 나의 성좌</div>
                <input type="text" id="myName" placeholder="당신의 성함 (필수)" required>
                <input type="tel" id="myPhone" placeholder="휴대폰 번호 (01012345678)" required>
                <div class="flex-row">
                    <div class="flex-item"><label>생년월일</label><input type="date" id="myBirth" required></div>
                    <div class="flex-item"><label>태어난 시간</label><input type="time" id="myTime"></div>
                </div>
                <select id="myGender"><option value="남성">남성</option><option value="여성">여성</option></select>
            </div>

            <!-- 상대방 정보 -->
            <div class="section">
                <div class="section-title">🌟 상대의 성좌</div>
                <input type="text" id="yourName" placeholder="상대방 성함 (필수)" required>
                <input type="tel" id="yourPhone" placeholder="상대방 번호 (필수)" required>
                <div class="flex-row">
                    <div class="flex-item"><label>생년월일</label><input type="date" id="yourBirth"></div>
                    <div class="flex-item"><label>태어난 시간</label><input type="time" id="yourTime"></div>
                </div>
                <label class="checkbox-group" style="margin-top: 10px;">
                    <input type="checkbox" id="birthUnknown" onchange="toggleBirth(this.checked)">
                    <span>상대방 생일 정보를 잘 모름</span>
                </label>
                <select id="yourGender"><option value="여성">여성</option><option value="남성">남성</option></select>
            </div>

            <!-- 동의 및 응모 -->
            <div class="agree-container">
                <label class="checkbox-group">
                    <input type="checkbox" id="agree" onchange="toggleSubmitBtn()">
                    <span style="color: var(--light-purple);">데이터 상관관계 분석을 위한 정보 활용에 동의함 (필수)</span>
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="eventAgree">
                    <span>무료 추가 사주 분석 응모 (선택)</span>
                </label>
            </div>

            <button type="button" id="submitBtn" class="btn-submit" disabled onclick="handleAnalysis()">천기누설 시작하기 ✨</button>
            
            <input type="hidden" name="entry.2059990547" id="gName">
            <input type="hidden" name="entry.669898893" id="gPhone">
            <input type="hidden" name="entry.708899075" id="gDetail">
        </form>
    </div>

    <!-- 결과 리포트 섹션 -->
    <div id="resultLayer">
        <h2 style="color: var(--star-gold); margin-bottom: 5px;">인연 분석 리포트</h2>
        <p id="resSubtitle" style="font-size: 0.9rem; color: var(--light-purple); margin-bottom: 25px;"></p>
        
        <div class="slide active" id="slide1">
            <div class="score-circle">
                <span id="resScore">0%</span>
                <span class="score-label">천생연분 지수</span>
            </div>
            <div class="analysis-card">
                <div class="card-sub">🔢 전화번호 수비학 분석</div>
                <div id="numAnalysis"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav next" onclick="moveSlide(2)">사주 심층 분석 보기 →</button>
            </div>
        </div>

        <div class="slide" id="slide2">
            <div class="analysis-card">
                <div class="card-sub" id="sajuTitle1"></div>
                <div id="sajuContent1"></div>
            </div>
            <div class="analysis-card">
                <div class="card-sub" id="sajuTitle2"></div>
                <div id="sajuContent2"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav" onclick="moveSlide(1)">← 이전</button>
                <button class="btn-nav next" onclick="moveSlide(3)">운명의 비책 보기 →</button>
            </div>
        </div>

        <div class="slide" id="slide3">
            <div class="analysis-card" style="border-left-color: var(--star-gold);">
                <div class="card-sub">📍 인연의 흐름 총평</div>
                <div id="finalReview" style="font-size:1.05rem;"></div>
            </div>
            <div class="analysis-card">
                <div class="card-sub">💡 관계를 빛낼 신의 한 수</div>
                <div id="finalAdvice"></div>
            </div>
            
            <div class="share-group">
                <button class="btn-share-link" id="shareBtn" onclick="generateShareUrl()">💌 상대방에게 결과 전송하기</button>
                <button class="btn-nav" style="background:#444;" onclick="location.href=window.location.pathname">새로 분석하기 ↩️</button>
            </div>
        </div>
    </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    // 상대방 생일 정보 입력창 제어
    function toggleBirth(val) {
        document.getElementById('yourBirth').disabled = val;
        document.getElementById('yourTime').disabled = val;
        if(val) {
            document.getElementById('yourBirth').value = "";
            document.getElementById('yourTime').value = "";
        }
    }

    // 분석하기 버튼 활성화 제어
    function toggleSubmitBtn() {
        const agree = document.getElementById('agree').checked;
        document.getElementById('submitBtn').disabled = !agree;
    }

    // 타로 수비학 데이터 (확장형)
    const tarotData = {
        1: { name: "Ace of Swords", text: "신비로운 1번의 에너지는 '개척과 진실'을 상징합니다. 현재 사용하시는 번호 끝자리에는 날카로운 이성의 기운이 서려 있습니다. 이 인연에 있어서는 어설픈 배려보다는 명확한 대화와 결단이 가장 중요한 핵심입니다. 거짓이나 미온적인 태도는 두 분 사이의 운명을 흐리게 만들 수 있습니다. 지금 가장 시급한 것은 서로의 진심을 투명하게 드러낼 수 있는 용기입니다. 1번의 기운은 용기 있는 자에게 인연의 승기를 쥐어줍니다. 당신의 리더십이 관계의 돌파구가 될 것입니다." },
        2: { name: "Two of Swords", text: "번호 끝자리 2번은 '균형과 긴장'의 기운을 담고 있습니다. 현재 두 분의 관계는 마치 팽팽하게 당겨진 활시위처럼 서로의 생각 차이를 조율하는 과정에 놓여 있습니다. 선택을 미루고 있지는 않으신가요? 지금은 어느 한쪽이 이기려 하기보다는, 수평적인 관계를 유지하며 서로의 다름을 '관찰'해야 하는 시기입니다. 서둘러 결론을 내기보다 잠시 눈을 감고 마음의 소리에 집중하세요. 평화는 침묵 속에 있으며, 서두름은 오히려 관계의 독이 됩니다." },
        3: { name: "Three of Swords", text: "수비학적으로 3번은 날카로운 감수성과 '성장통'을 의미합니다. 과거의 사소한 상처나 무심코 던진 말 한마디가 가슴 깊은 곳에 가시처럼 남아 있을 가능성이 높습니다. 하지만 비가 온 뒤 땅이 굳어지듯, 이 감정적 흔들림은 사실 두 분이 더 깊은 이해의 단계로 넘어가기 위한 필수적인 관문입니다. 날카로운 논쟁보다는 따뜻한 포용과 먼저 건네는 위로가 두 분의 운명적 매듭을 더욱 단단하게 묶어줄 것입니다. 상처를 진주로 만드는 힘은 오직 당신에게 있습니다." },
        4: { name: "Four of Swords", text: "번호 끝자리 4번은 '휴식과 재정비'를 뜻합니다. 달려오기만 했던 관계에 있어 지금 가장 필요한 것은 서로의 물리적, 정서적인 거리입니다. 관계가 소원해진 것이 아니라, 더 큰 도약을 위해 각자의 에너지를 채워야 할 시점임을 하늘이 알려주고 있습니다. 명상이나 조용한 취미를 공유하거나, 잠시 대화를 멈추고 서로의 존재를 느끼는 정적인 시간을 가져보세요. 내일의 커다란 사랑을 위해 오늘의 칼을 잠시 내려놓는 지혜가 필요합니다. 멈춤은 곧 전진의 준비입니다." },
        5: { name: "Five of Swords", text: "5번의 기운은 '자존심의 격돌'을 예고합니다. 두 분 모두 자기 색깔이 뚜렷하다 보니 사소한 일에서도 이기려는 마음이 앞설 수 있습니다. 하지만 기억하세요. 사랑에서의 승리는 상대를 굴복시키는 것이 아니라, 내 안의 이기심을 꺽고 상대의 품에 안기는 것입니다. 한 걸음 물러나 주는 것이 진정으로 인연을 장악하는 길입니다. 소모적인 기싸움을 멈추고 함께 바라보고 있는 먼 미래의 공동 목표에 집중하시길 바랍니다. 승자 없는 전쟁을 멈출 열쇠는 겸손입니다." },
        6: { name: "Six of Swords", text: "6번은 '안식처로의 항해'를 뜻하는 매우 긍정적인 신호입니다. 최근 어려운 고비를 넘겼다면 이제는 평화로운 시기로 접어드는 입구에 서 계십니다. 당신이 사용하는 번호는 주변인의 도움이나 환경의 변화가 두 분의 관계를 예상치 못한 길로 이끌어 줄 것임을 암시합니다. 과거에 얽매이기보다 함께 떠나는 여행이나 새로운 취미를 시작하는 것이 인연의 불길을 다시 지필 것입니다. 믿고 노를 저어가세요. 당신이 도달할 곳은 고요하고 행복한 섬입니다." },
        7: { name: "Seven of Swords", text: "번호 7번은 '지혜와 신비주의'를 상징합니다. 모든 것을 다 보여주는 투명함도 좋지만, 때로는 적절한 비밀과 밀당이 관계의 생명력을 연장시킵니다. 당신의 매력은 정복되지 않는 신비로움에서 나옵니다. 상대방에게 모든 패를 보여주지 마세요. 가끔은 의외의 장소에서의 만남이나 생각지 못한 이벤트를 준비하여 상대의 호기심을 끊임없이 자극해야 합니다. 당신만의 지적인 게임에 상대를 초대하여 주도권을 뺏어오세요. 신비로움은 인연의 유통기한을 영원하게 만듭니다." },
        8: { name: "Eight of Swords", text: "8번의 번호를 가진 분은 스스로를 가두고 있는 '마음의 벽'을 조심해야 합니다. 상대가 나를 사랑하지 않을까 봐, 혹은 상처받을까 봐 미리 벽을 쌓고 있지는 않나요? 사실 그 감옥의 열쇠는 당신의 손에 쥐어져 있습니다. 눈가리개를 벗고 현실을 직시하세요. 상대방은 당신이 생각하는 것보다 훨씬 더 큰 포용력을 준비하고 있습니다. 두려움을 떨치고 손을 먼저 내밀 때, 운명은 비로소 자유로워질 것입니다. 당신을 묶고 있는 밧줄은 사실 느슨하게 풀려 있습니다." },
        9: { name: "Nine of Swords", text: "9번은 '심리적 압박과 과도한 생각'의 수입니다. 밤잠을 설치며 상대방의 행동 하나하나에 큰 의미를 부여하고 계신다면, 그것은 번호가 주는 부정적인 파동에 휘말린 것입니다. 고민의 90%는 현실에서 일어나지 않을 허상입니다. 마음의 짐을 내려놓으세요. 오히려 직접적으로 본인의 불안함을 솔직하게 털어놓는 순간, 그 모든 어둠은 아침 해와 함께 사라질 것입니다. 현재의 즐거움에만 집중해도 충분히 아름다운 인연입니다. 걱정은 사랑의 시간을 갉아먹을 뿐입니다." },
        0: { name: "Ten of Swords", text: "0번(수비학에서는 10)은 '완성이자 새로운 시작'을 뜻합니다. 당신은 지금 막다른 길에 서 있을지 모르지만, 이는 곧 새로운 햇살이 비치기 직전의 가장 어두운 새벽임을 알려줍니다. 낡은 연애 방식이나 불필요한 고집을 완전히 버려야 할 때입니다. 과거를 완전히 매듭짓고 새롭게 다시 시작하는 기운이 강하게 들어와 있습니다. 고통스러운 변화 뒤에는 반드시 환희에 찬 보상이 따르는 법입니다. 이제 다시 비상할 일만 남았습니다. 바닥을 찍었으니 이제 올라갈 일뿐입니다." }
    };

    let cachedData = null;

    function moveSlide(n) {
        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
        document.getElementById('slide' + n).classList.add('active');
        window.scrollTo(0,0);
    }

    // 사주 분석 텍스트 생성 (확장형)
    function getSajuDesc(name, birth, time, gender, pLast) {
        if(!birth) return `상대방의 구체적인 생시 정보가 신비에 가려져 있으나, 번호 끝자리 ${pLast}번의 수비학적 파동만으로보아 상대는 본인의 마음을 쉽게 허락하지 않으면서도 한 번 사랑을 느끼면 삶의 지축이 흔들릴 만큼 깊이 몰입하는 성향입니다. 천문의 기운은 동적인 환경에서 인연의 꽃이 필 것임을 암시합니다.`;
        const month = parseInt(birth.split('-')[1]);
        let mText = "", pText = "", eText = "";
        
        if([3,4,5].includes(month)) {
            mText = `${name}님은 만물이 소생하는 생명력 넘치는 봄의 정기와 곧게 뻗어 나가는 '목(木)'의 기운을 천성으로 타고났습니다. `;
            pText = `성격적으로는 마치 대지를 뚫고 나오는 새싹처럼 불의를 참지 못하는 강직함과 타인을 배려하는 부드러운 리더십을 동시에 갖추고 있습니다. 사랑에 있어서도 가식보다는 진실함을 중시하며, 한 번 믿음을 주면 비바람에도 흔들리지 않는 뿌리 깊은 나무 같은 충직함을 보여줍니다. `;
            eText = `하지만 나무는 너무 뻣뻣하면 부러지는 법입니다. 상대방에게 당신의 기준을 고집하기보다 때로는 부드러운 갈대처럼 유연하게 대처한다면 관계의 깊이는 상상 이상으로 깊어질 것입니다.`;
        } else if([6,7,8].includes(month)) {
            mText = `${name}님은 여름 태양 아래 맹렬히 타오르는 '화(火)' 기운을 지닌 열정적이고 찬란한 영혼입니다. `;
            pText = `당신은 존재만으로도 주변을 환하게 밝히는 에너지를 가졌습니다. 솔직담백하고 뒤끝 없는 성격 덕에 이성에게 늘 인기가 많으며, 연애 초기에는 그 누구보다 화끈하고 로맨틱하게 사랑을 불태우는 타입입니다. `;
            eText = `다만, 불은 연료가 떨어지면 금방 식을 위험이 있습니다. 상대방과의 정서적 공감과 지적인 대화를 통해 열정의 온도를 꾸준히 유지하는 것이 핵심입니다. 감정의 급물살에 휘말리지 않도록 주의한다면 세기의 사랑을 나눌 수 있습니다.`;
        } else if([9,10,11].includes(month)) {
            mText = `${name}님은 결실을 맺는 수확의 가을, 냉철하고 단단한 '금(金)' 기운을 타고난 지혜로운 분입니다. `;
            pText = `맺고 끊음이 확실하며 거짓을 멀리하는 정의로운 성품입니다. 연애에 있어서도 밀당보다는 신뢰와 예의를 최우선으로 생각합니다. 겉으론 차갑고 예리해 보일지 몰라도, 속은 누구보다 귀한 황금처럼 빛나는 순수함을 품고 있습니다. `;
            eText = `금속은 담금질을 통해 보석이 됩니다. 상대를 판단하기 앞서 본인의 풍부한 감성을 조금 더 드러내 보세요. 당신의 차가운 이성에 따스한 배려가 한 방울 섞일 때 인연은 영원히 변치 않는 다이아몬드가 될 것입니다.`;
        } else {
            mText = `${name}님은 깊은 바다와 같이 무궁무진한 지혜를 품은 겨울의 '수(水)' 기운을 상징합니다. `;
            pText = `유연한 사고방식과 타인의 마음을 읽어내는 탁월한 직관력을 가졌습니다. 조용히 뒤에서 상대를 서포트하며 결정적인 순간에 해결책을 제시하는 당신은 인연에게 있어 세상 그 무엇보다 든든한 등대와 같은 존재입니다. `;
            eText = `고인 물은 썩기 쉽고 얼어붙은 물은 차갑습니다. 마음속 깊이 담아둔 진심이나 고민을 혼자 삭히지 말고 강물처럼 흐르게 하세요. 당신이 마음을 열고 소통할 때 두 사람의 관계는 끝없이 깊고 푸른 바다처럼 풍요로워질 것입니다.`;
        }
        return mText + pText + eText + `\n\n특히 태어난 시각(${time || '미상'})의 기운이 올해의 천문 흐름과 공명하여 '${gender=='여성'?'연애운':'애정운'}'의 에너지가 매우 강력하게 활성화된 상태입니다.`;
    }

    // 모든 입력 검증 및 분석 핸들러
    function handleAnalysis() {
        const n1 = document.getElementById('myName').value.trim();
        const p1Raw = document.getElementById('myPhone').value.replace(/[^0-9]/g, '');
        const b1 = document.getElementById('myBirth').value;
        const n2 = document.getElementById('yourName').value.trim();
        const p2Raw = document.getElementById('yourPhone').value.replace(/[^0-9]/g, '');
        const b2 = document.getElementById('yourBirth').value;
        const unknown = document.getElementById('birthUnknown').checked;

        // 1. 필수값 체크 로직
        if(!n1 || !p1Raw || !b1 || !n2 || !p2Raw) {
            alert("⚠️ 비어있는 항목을 확인해주세요! \n성함, 번호, 생년월일은 운명 분석의 필수 재료입니다.");
            return;
        }

        // 2. 전화번호 유효성 체크
        if(p1Raw.length !== 11 || p2Raw.length !== 11) {
            alert("⚠️ 전화번호 형식이 올바르지 않습니다.\n'01012345678' 형태의 숫자 11자리를 정확히 입력해주세요.");
            return;
        }

        // 3. 상대방 생일 모름 체크 안했는데 비어있는 경우
        if(!unknown && !b2) {
            alert("⚠️ 상대방의 생년월일을 입력하시거나\n'잘 모름' 체크박스를 선택해주세요.");
            return;
        }

        const d = {
            n1: n1, p1: p1Raw, b1: b1, t1: document.getElementById('myTime').value, g1: document.getElementById('myGender').value,
            n2: n2, p2: p2Raw, b2: b2, t2: document.getElementById('yourTime').value, g2: document.getElementById('yourGender').value,
            event: document.getElementById('eventAgree').checked ? "응모함" : "미응모"
        };

        // 전송 데이터 가공
        document.getElementById('gName').value = d.n1 + " | " + d.n2;
        document.getElementById('gPhone').value = d.p1 + " | " + d.p2;
        document.getElementById('gDetail').value = `분석정보:${JSON.stringify(d)}`;
        document.getElementById('loveForm').submit();

        cachedData = d;
        showResult(d);
    }

    function showResult(d) {
        document.getElementById('inputLayer').style.display = 'none';
        document.getElementById('resultLayer').style.display = 'block';
        document.getElementById('resSubtitle').innerText = `${d.n1} 님과 ${d.n2} 님의 천문 공명 리포트`;

        const p1Last = parseInt(d.p1.slice(-1)) || 0;
        const p2Last = parseInt(d.p2.slice(-1)) || 0;

        document.getElementById('numAnalysis').innerHTML = `<div style='margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;'><strong>[${d.n1}님]</strong><br>${tarotData[p1Last].text}</div><div><strong>[${d.n2}님]</strong><br>${tarotData[p2Last].text}</div>`;
        document.getElementById('sajuTitle1').innerText = `🌙 ${d.n1}님의 운명 성향`;
        document.getElementById('sajuContent1').innerText = getSajuDesc(d.n1, d.b1, d.t1, d.g1, p1Last);
        document.getElementById('sajuTitle2').innerText = `✨ ${d.n2}님의 운명 성향`;
        document.getElementById('sajuContent2').innerText = getSajuDesc(d.n2, d.b2, d.t2, d.g2, p2Last);

        let score = 75 + (p1Last % 4) * 3 + (p2Last % 4) * 3;
        if(p1Last === p2Last) score += 10;
        if(score > 99) score = 99;
        document.getElementById('resScore').innerText = score + "%";

        document.getElementById('finalReview').innerText = `두 사람의 결합 에너지는 '${score}%'라는 놀라운 동조율을 기록하고 있습니다. 이는 단순한 우연을 넘어 서로가 서로의 운명을 보완해 주는 '상승 기류형 인연'임을 강력하게 시사합니다. 처음 만났을 때 느꼈던 기묘한 익숙함은 전생에서부터 이어져 온 인연의 끈이 다시 매듭지어진 결과입니다. 서로의 가치관이 정반대에 위치할지라도, 사실 그것은 하나의 진실을 향한 양면의 모습일 뿐입니다. 서로의 눈동자에서 자신의 가장 아름다운 모습을 발견하게 될 것입니다.`;
        
        document.getElementById('finalAdvice').innerText = `1. [운명의 공진 장소]: 물이 보이는 고요한 카페나 큰 나무가 울창한 숲길을 걸으며 대화하세요. 지친 정신 에너지가 정화됩니다.\n\n2. [주의해야 할 언령]: 두 분 모두 번호에 서린 예리한 검(Sword)의 자취가 있어 자칫하면 '조언'이라는 이름의 비수가 상처를 줄 수 있습니다. 정답을 제시하기보다 감정을 먼저 물어봐 주는 지혜가 필요합니다.\n\n3. [화합의 성좌 의식]: 매주 일요일 밤, 서로에게 고마운 점 세 가지를 따뜻하게 말해주세요. 수비학적으로 흩어지기 쉬운 기운을 하나로 모아 영원한 사랑을 약속하는 강력한 비책이 될 것입니다.`;
    }

    function generateShareUrl() {
        if(!cachedData) return;
        const encoded = btoa(encodeURIComponent(JSON.stringify(cachedData)));
        const url = window.location.origin + window.location.pathname + "?res=" + encoded;
        const dummy = document.createElement("input");
        document.body.appendChild(dummy);
        dummy.value = url;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        const btn = document.getElementById('shareBtn');
        btn.innerText = "✅ 링크 복사 완료!";
        btn.style.background = "#00b894";
        alert("분석 링크가 복사되었습니다! ✨");
    }

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const resHash = urlParams.get('res');
        if(resHash) {
            try {
                const data = JSON.parse(decodeURIComponent(atob(resHash)));
                showResult(data);
                const sBtn = document.getElementById('shareBtn');
                sBtn.innerText = "🌀 나도 인연 분석해보기";
                sBtn.onclick = () => location.href = window.location.pathname;
            } catch(e) { console.error("URL Data Error"); }
        }
    }
</script>
