<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 신비로운 인연 분석기 ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --mystic-purple: #6e57e0;
            --light-purple: #decaff;
            --deep-purple: #2a1b5d;
            --star-gold: #fff9c4;
            --bg-night: #1a1a2e;
        }
        body { font-family: 'Jua', sans-serif; background: var(--bg-night); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #2a1b5d 0%, #1a1a2e 100%);
            z-index: -1;
        }

        .container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: var(--light-purple); text-shadow: 0 0 10px var(--mystic-purple); margin-bottom: 30px; }
        
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid var(--mystic-purple); margin-bottom: 20px; }
        .section-title { color: var(--star-gold); margin-bottom: 15px; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        
        label { display: block; font-size: 0.85rem; color: var(--light-purple); margin-bottom: 5px; margin-left: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(0,0,0,0.3); color: white; margin-bottom: 12px; font-family: 'Jua'; box-sizing: border-box; font-size: 1rem; }
        
        .flex-row { display: flex; gap: 10px; align-items: flex-end; }
        .flex-item { flex: 1; }
        
        .checkbox-group { display: flex; align-items: center; font-size: 0.8rem; gap: 5px; color: #ccc; margin-top: -8px; margin-bottom: 10px; }
        .checkbox-group input { width: auto; margin: 0; }

        .btn-submit { width: 100%; padding: 18px; background: linear-gradient(45deg, var(--mystic-purple), #a29bfe); color: white; border: none; border-radius: 20px; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 15px rgba(110, 87, 224, 0.4); }
        .btn-submit:disabled { opacity: 0.5; }

        #resultLayer { display: none; text-align: center; }
        .slide { display: none; animation: fadeIn 0.6s ease-out; text-align: left; }
        .slide.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 5px solid var(--star-gold); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 2.8rem; margin: 0 auto 25px; color: var(--star-gold); background: rgba(0,0,0,0.3); box-shadow: 0 0 25px rgba(255, 249, 196, 0.2); }
        .score-label { font-size: 0.9rem; margin-top: -5px; opacity: 0.8; }
        
        .analysis-card { background: rgba(255,255,255,0.07); padding: 22px; border-radius: 22px; border-left: 5px solid var(--mystic-purple); margin-bottom: 20px; line-height: 1.9; font-size: 0.98rem; color: #f0f0f0; white-space: pre-wrap; word-break: keep-all; }
        .card-sub { color: var(--star-gold); font-size: 1.15rem; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; font-weight: bold; }

        .nav-btns { display: flex; gap: 10px; margin-top: 25px; }
        .btn-nav { flex: 1; padding: 15px; border-radius: 15px; border: 1px solid var(--mystic-purple); background: rgba(110, 87, 224, 0.15); color: white; cursor: pointer; font-family: 'Jua'; font-size: 1.1rem; }
        .btn-nav.next { background: var(--mystic-purple); }
        
        .share-group { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 30px; }
        .btn-share-link { background: linear-gradient(45deg, #ff7675, #ef5777); color: white; border: none; padding: 20px; border-radius: 20px; font-size: 1.3rem; font-family: 'Jua'; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <div id="inputLayer">
        <h1>✨ 운명의 성좌 분석 ✨</h1>
        <form id="loveForm" action="https://docs.google.com/forms/d/e/1FAIpQLSeKkP4HuJ5J4jW_XOrs2ryEpfSeuWn5VvbaOmMQhHKTmAxUpg/formResponse" method="POST" target="hidden_iframe">
            <div class="section">
                <div class="section-title">🔮 나의 정보</div>
                <input type="text" id="myName" placeholder="성함" required>
                <input type="text" id="myPhone" placeholder="전화번호 (01012345678)" required>
                <div class="flex-row">
                    <div class="flex-item"><label>생년월일</label><input type="date" id="myBirth" required></div>
                    <div class="flex-item"><label>태어난 시간</label><input type="time" id="myTime"></div>
                </div>
                <select id="myGender"><option value="남성">남성</option><option value="여성">여성</option></select>
            </div>

            <div class="section">
                <div class="section-title">🌟 상대방 정보</div>
                <input type="text" id="yourName" placeholder="성함" required>
                <input type="text" id="yourPhone" placeholder="전화번호" required>
                <div class="flex-row">
                    <div class="flex-item"><label>생년월일</label><input type="date" id="yourBirth"></div>
                    <div class="flex-item"><label>태어난 시간</label><input type="time" id="yourTime"></div>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="birthUnknown" onchange="document.getElementById('yourBirth').disabled = this.checked; document.getElementById('yourTime').disabled = this.checked;">
                    <label for="birthUnknown">상대방 정보 잘 모름</label>
                </div>
                <select id="yourGender"><option value="여성">여성</option><option value="남성">남성</option></select>
            </div>

            <div style="text-align:center; font-size:0.8rem; margin-bottom:20px;">
                <input type="checkbox" id="agree" onchange="document.getElementById('submitBtn').disabled = !this.checked"> 데이터 상관관계 분석을 위한 정보 활용에 동의함
                
            </div>
            <button type="button" id="submitBtn" class="btn-submit" disabled onclick="handleAnalysis()">결과 보기 ✨</button>
            
            <input type="hidden" name="entry.2059990547" id="gName">
            <input type="hidden" name="entry.669898893" id="gPhone">
            <input type="hidden" name="entry.708899075" id="gDetail">
        </form>
    </div>

    <!-- 결과 리포트 섹션 -->
    <div id="resultLayer">
        <h2 style="color: var(--star-gold); margin-bottom: 5px;">인연 분석 리포트</h2>
        <p id="resSubtitle" style="font-size: 0.9rem; color: var(--light-purple); margin-bottom: 25px;"></p>
        
        <div class="slide active" id="slide1">
            <div class="score-circle">
                <span id="resScore">0%</span>
                <span class="score-label">천생연분 지수</span>
            </div>
            <div class="analysis-card">
                <div class="card-sub">🔢 전화번호 수비학 분석</div>
                <div id="numAnalysis"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav next" onclick="moveSlide(2)">사주 심층 분석 보기 →</button>
            </div>
        </div>

        <div class="slide" id="slide2">
            <div class="analysis-card">
                <div class="card-sub" id="sajuTitle1"></div>
                <div id="sajuContent1"></div>
            </div>
            <div class="analysis-card">
                <div class="card-sub" id="sajuTitle2"></div>
                <div id="sajuContent2"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav" onclick="moveSlide(1)">← 이전</button>
                <button class="btn-nav next" onclick="moveSlide(3)">운명의 비책 보기 →</button>
            </div>
        </div>

        <div class="slide" id="slide3">
            <div class="analysis-card" style="border-left-color: var(--star-gold);">
                <div class="card-sub">📍 인연의 흐름 총평</div>
                <div id="finalReview" style="font-size:1.05rem;"></div>
            </div>
            <div class="analysis-card">
                <div class="card-sub">💡 관계를 빛낼 신의 한 수</div>
                <div id="finalAdvice"></div>
            </div>
            
            <div class="share-group">
                <button class="btn-share-link" id="shareBtn" onclick="generateShareUrl()">💌 상대방에게 결과 전송하기</button>
                <button class="btn-nav" style="background:#444;" onclick="location.href=window.location.pathname">새로 분석하기 ↩️</button>
            </div>
        </div>
    </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    const tarotData = {
        1: { name: "Ace of Swords (에이스 오브 소드)", text: "신비로운 1번의 에너지는 '개척과 진실'을 상징합니다. 현재 사용하시는 번호 끝자리에는 날카로운 이성의 기운이 서려 있습니다. 이 인연에 있어서는 어설픈 배려보다는 명확한 대화와 결단이 가장 중요한 핵심입니다. 거짓이나 미온적인 태도는 두 분 사이의 운명을 흐리게 만들 수 있습니다. 지금 가장 시급한 것은 서로의 진심을 투명하게 드러낼 수 있는 용기입니다. 1번의 기운은 용기 있는 자에게 인연의 승기를 쥐어줍니다." },
        2: { name: "Two of Swords (투 오브 소드)", text: "번호 끝자리 2번은 '균형과 긴장'의 기운을 담고 있습니다. 현재 두 분의 관계는 마치 팽팽하게 당겨진 활시위처럼 서로의 생각 차이를 조율하는 과정에 놓여 있습니다. 선택을 미루고 있지는 않으신가요? 지금은 어느 한쪽이 이기려 하기보다는, 수평적인 관계를 유지하며 서로의 다름을 '관찰'해야 하는 시기입니다. 서둘러 결론을 내기보다 잠시 눈을 감고 마음의 소리에 집중하세요. 평화는 침묵 속에 있습니다." },
        3: { name: "Three of Swords (쓰리 오브 소드)", text: "수비학적으로 3번은 날카로운 감수성과 '성장통'을 의미합니다. 과거의 사소한 상처나 무심코 던진 말 한마디가 가슴 깊은 곳에 가시처럼 남아 있을 가능성이 높습니다. 하지만 비가 온 뒤 땅이 굳어지듯, 이 감정적 흔들림은 사실 두 분이 더 깊은 이해의 단계로 넘어가기 위한 필수적인 관문입니다. 날카로운 논쟁보다는 따뜻한 포용과 먼저 건네는 위로가 두 분의 운명적 매듭을 더욱 단단하게 묶어줄 것입니다." },
        4: { name: "Four of Swords (포 오브 소드)", text: "번호 끝자리 4번은 '휴식과 재정비'를 뜻합니다. 달려오기만 했던 관계에 있어 지금 가장 필요한 것은 서로의 물리적, 정서적인 거리입니다. 관계가 소원해진 것이 아니라, 더 큰 도약을 위해 각자의 에너지를 채워야 할 시점임을 하늘이 알려주고 있습니다. 명상이나 조용한 취미를 공유하거나, 잠시 대화를 멈추고 서로의 존재를 느끼는 정적인 시간을 가져보세요. 내일의 사랑을 위해 오늘의 칼을 잠시 내려놓는 지혜가 필요합니다." },
        5: { name: "Five of Swords (파이브 오브 소드)", text: "5번의 기운은 '자존심의 격돌'을 예고합니다. 두 분 모두 자기 색깔이 뚜렷하다 보니 사소한 일에서도 이기려는 마음이 앞설 수 있습니다. 하지만 기억하세요. 사랑에서의 승리는 상대를 굴복시키는 것이 아니라, 내 안의 이기심을 꺽고 상대의 품에 안기는 것입니다. 한 걸음 물러나 주는 것이 진정으로 인연을 장악하는 길입니다. 소모적인 기싸움을 멈추고 함께 바라보고 있는 먼 미래의 목표에 집중하시길 바랍니다." },
        6: { name: "Six of Swords (식스 오브 소드)", text: "6번은 '안식처로의 항해'를 뜻하는 매우 긍정적인 신호입니다. 최근 어려운 고비를 넘겼다면 이제는 평화로운 시기로 접어드는 입구에 서 계십니다. 당신이 사용하는 번호는 주변인의 도움이나 환경의 변화가 두 분의 관계를 예상치 못한 길로 이끌어 줄 것임을 암시합니다. 과거에 얽매이기보다 함께 떠나는 여행이나 이사, 새로운 공동 프로젝트가 인연의 불길을 다시 지필 것입니다. 믿고 노를 저어가세요." },
        7: { name: "Seven of Swords (세븐 오브 소드)", text: "번호 7번은 '지혜와 신비주의'를 상징합니다. 모든 것을 다 보여주는 투명함도 좋지만, 때로는 적절한 비밀과 밀당이 관계의 생명력을 연장시킵니다. 당신의 매력은 정복되지 않는 신비로움에서 나옵니다. 상대방에게 모든 패를 보여주지 마세요. 가끔은 의외의 장소에서의 만남이나 생각지 못한 이벤트를 준비하여 상대의 호기심을 끊임없이 자극해야 합니다. 당신만의 지적인 게임에 상대를 초대하여 주도권을 뺏어오세요." },
        8: { name: "Eight of Swords (에잇 오브 소드)", text: "8번의 번호를 가진 분은 스스로를 가두고 있는 '마음의 벽'을 조심해야 합니다. 상대가 나를 사랑하지 않을까 봐, 혹은 상처받을까 봐 미리 벽을 쌓고 있지는 않나요? 사실 그 감옥의 열쇠는 당신의 손에 쥐어져 있습니다. 눈가리개를 벗고 현실을 직시하세요. 상대방은 당신이 생각하는 것보다 훨씬 더 큰 포용력을 준비하고 있습니다. 두려움을 떨치고 손을 먼저 내밀 때, 운명은 비로소 자유로워질 것입니다." },
        9: { name: "Nine of Swords (나인 오브 소드)", text: "9번은 '심리적 압박과 과도한 생각'의 수입니다. 밤잠을 설치며 상대방의 행동에 의미를 부여하고 계신다면, 그것은 번호가 주는 부정적인 파동에 휘말린 것입니다. 고민의 90%는 현실에서 일어나지 않을 허상입니다. 마음의 짐을 내려놓으세요. 오히려 직접적으로 본인의 불안함을 솔직하게 털어놓는 순간, 그 모든 어둠은 아침 해와 함께 사라질 것입니다. 현재의 즐거움에만 집중해도 충분히 아름다운 인연입니다." },
        0: { name: "Ten of Swords (텐 오브 소드)", text: "0번(수비학에서는 10)은 '완성이자 새로운 시작'을 뜻합니다. 당신은 지금 막다른 길에 서 있을지 모르지만, 이는 곧 새로운 햇살이 비치기 직전의 가장 어두운 새벽임을 알려줍니다. 낡은 연애 방식이나 불필요한 고집을 완전히 버려야 할 때입니다. 과거를 완전히 매듭짓고 새롭게 다시 시작하는 기운이 강하게 들어와 있습니다. 고통스러운 변화 뒤에는 반드시 보상이 따르는 법입니다. 이제 다시 비상할 일만 남았습니다." }
    };

    let cachedData = null;

    function moveSlide(n) {
        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
        document.getElementById('slide' + n).classList.add('active');
        window.scrollTo(0,0);
    }

    function getSajuDesc(name, birth, time, gender, pLast) {
        if(!birth) return `상대방의 구체적인 생시가 알려지지 않았으나, 전화번호 끝자리 ${pLast}번의 파동 분석만으로도 '강렬한 인력'이 느껴집니다. 상대방은 본인을 드러내기보다 관찰하는 신중한 성정이나, 한 번 마음을 열면 모든 것을 거는 타입일 것입니다.`;
        const month = parseInt(birth.split('-')[1]);
        let mText = "", pText = "", eText = "";
        
        if([3,4,5].includes(month)) {
            mText = `${name}님은 만물이 소생하는 생명력 넘치는 봄의 정기와 강직한 '목(木)'의 기운을 천성으로 타고났습니다. `;
            pText = `성격적으로는 마치 곧게 뻗은 대나무처럼 타협을 모르는 고결한 성정과 타인을 이끄는 부드러운 리더십을 동시에 갖추고 있습니다. 사랑에 있어서는 한 번 신뢰를 쌓으면 흔들리지 않는 뿌리 깊은 나무와 같은 충직함을 보입니다. `;
            eText = `하지만 나무는 바람에 흔들려야 부러지지 않습니다. 상대방에게 완벽한 모습을 강요하기보다 때로는 본인의 취약함도 보여주어 정서적 유대감을 높이는 것이 좋습니다.`;
        } else if([6,7,8].includes(month)) {
            mText = `${name}님은 만개한 태양 아래 뜨겁게 타오르는 여름의 '화(火)' 기운을 지닌 열정적인 예술가 같은 영혼입니다. `;
            pText = `당신이 머무는 곳엔 언제나 활기찬 에너지가 흐르며, 뒤끝 없고 솔직담백한 성격으로 주변의 시선을 한몸에 받습니다. 금방 타오르고 쉽게 식을 수 있는 성정이니 감정 조절이 연애의 핵심입니다. `;
            eText = `불은 연료와 적절한 산소가 있어야 지속됩니다. 상대방과의 지적인 대화와 서로의 꿈을 응원하는 지지가 당신의 애정이라는 불을 끄지 않게 하는 최고의 연료가 될 것입니다.`;
        } else if([9,10,11].includes(month)) {
            mText = `${name}님은 결실을 거두는 수확의 계절, 가을의 '금(金)' 기운을 지닌 냉철한 이성과 단호함을 겸비한 분입니다. `;
            pText = `정의롭고 맺고 끊음이 명확하여 연인들 사이에서도 가장 신뢰받는 타입입니다. 겉으론 차가운 금속처럼 보일지 모르나, 속은 누구보다 단단하고 가치 있는 황금 같은 마음을 품고 계십니다. `;
            eText = `금속은 담금질을 포기할 때 빛을 잃습니다. 가끔은 상대의 실수에도 부드럽게 윤활유를 발라주는 포용력을 기르세요. 당신의 냉철함에 따뜻함이 한 방울 섞일 때 인연은 보석이 됩니다.`;
        } else {
            mText = `${name}님은 깊은 바닷속처럼 지혜롭고 유연한 겨울의 '수(水)' 기운을 상징하는 분입니다. `;
            pText = `어떤 환경에서도 적응력이 뛰어나며 상대방의 마음을 꿰뚫어 보는 직관력이 탁월합니다. 조용히 뒤에서 상대를 서포트하며 필요한 순간에 결정적인 조언을 건네는 당신은 존재만으로 든든한 버팀목입니다. `;
            eText = `흐르지 않는 물은 고이기 마련입니다. 속에 담아둔 생각이나 불만을 혼자 삭히지 마세요. 강물처럼 흐르고 바다처럼 넓게 소통할 때 두 분의 사랑은 더욱 맑고 투명해질 것입니다.`;
        }
        return mText + pText + eText + `\n\n특히 태어난 시각(${time || '미상'})의 기운이 올해의 '${gender=='여성'?'관성':'재성'}'운과 합을 이루어 인연의 끈이 더욱 팽팽해지는 해입니다.`;
    }

    function handleAnalysis() {
        const d = {
            n1: document.getElementById('myName').value,
            p1: document.getElementById('myPhone').value.replace(/[^0-9]/g, ''),
            b1: document.getElementById('myBirth').value,
            t1: document.getElementById('myTime').value,
            g1: document.getElementById('myGender').value,
            n2: document.getElementById('yourName').value,
            p2: document.getElementById('yourPhone').value.replace(/[^0-9]/g, ''),
            b2: document.getElementById('yourBirth').value,
            t2: document.getElementById('yourTime').value,
            g2: document.getElementById('yourGender').value
        };

        // 구글 폼 사일런트 전송
        document.getElementById('gName').value = d.n1 + " | " + d.n2;
        document.getElementById('gPhone').value = d.p1 + " | " + d.p2;
        document.getElementById('gDetail').value = JSON.stringify(d);
        document.getElementById('loveForm').submit();

        cachedData = d;
        showResult(d);
    }

    function showResult(d) {
        document.getElementById('inputLayer').style.display = 'none';
        document.getElementById('resultLayer').style.display = 'block';
        document.getElementById('resSubtitle').innerText = `${d.n1} 님과 ${d.n2} 님의 운명 공명 리포트`;

        const p1Last = parseInt(d.p1.slice(-1)) || 0;
        const p2Last = parseInt(d.p2.slice(-1)) || 0;

        document.getElementById('numAnalysis').innerHTML = `<div style='margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;'><strong>[${d.n1}님]</strong><br>${tarotData[p1Last].text}</div><div><strong>[${d.n2}님]</strong><br>${tarotData[p2Last].text}</div>`;
        document.getElementById('sajuTitle1').innerText = `🌙 ${d.n1}님의 운명 성향`;
        document.getElementById('sajuContent1').innerText = getSajuDesc(d.n1, d.b1, d.t1, d.g1, p1Last);
        document.getElementById('sajuTitle2').innerText = `✨ ${d.n2}님의 운명 성향`;
        document.getElementById('sajuContent2').innerText = getSajuDesc(d.n2, d.b2, d.t2, d.g2, p2Last);

        let score = 75 + (p1Last % 4) * 3 + (p2Last % 4) * 3;
        if(p1Last === p2Last) score += 10;
        if(score > 99) score = 99;
        document.getElementById('resScore').innerText = score + "%";

        document.getElementById('finalReview').innerText = `두 분의 결합 에너지는 '${score}%'라는 경이로운 동조율을 보입니다. 이는 서로의 단점을 지우고 장점을 증폭시키는 '상승 기류형 인연'임을 뜻합니다. 만난 지 얼마 되지 않았어도 오래 알고 지낸 것 같은 친밀함의 근원이 바로 이곳에 있습니다. 서로의 가치관이 정 반대에 있을지라도, 사실 그것은 하나의 진실을 향한 양면의 모습일 뿐입니다. 서로의 눈동자에서 자신의 미래를 보게 되는 특별한 경험을 하게 될 것입니다.`;
        
        document.getElementById('finalAdvice').innerText = `1. [운명의 장소]: 물이 있는 조용한 곳이나 큰 나무가 있는 숲길을 걸으며 대화하세요. 지친 기운이 정화됩니다.\n2. [주의할 한마디]: 번호에 서린 검(Sword)의 기운은 자칫하면 '충고'라는 이름의 상처가 됩니다. 정답을 말하기보다 감정을 먼저 물어봐 주세요.\n3. [화합의 비책]: 매주 고마운 점을 소리 내어 말할 때 두 분의 성좌(Star)는 더욱 밝게 빛납니다. 말의 힘을 믿으세요.`;
    }

    function generateShareUrl() {
        if(!cachedData) return;
        const json = JSON.stringify(cachedData);
        // Base64 인코딩으로 데이터 포함 URL 생성
        const encoded = btoa(encodeURIComponent(json));
        const url = window.location.origin + window.location.pathname + "?res=" + encoded;

        const dummy = document.createElement("input");
        document.body.appendChild(dummy);
        dummy.value = url;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);

        const btn = document.getElementById('shareBtn');
        btn.innerText = "✅ 공유 링크 복사 완료!";
        btn.style.background = "#00b894";
        alert("운명 분석 링크가 복사되었습니다! 상대방에게 전달하여 두 사람의 결과를 공유하세요. ✨");
    }

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const resHash = urlParams.get('res');
        if(resHash) {
            try {
                const decoded = decodeURIComponent(atob(resHash));
                const data = JSON.parse(decoded);
                cachedData = data;
                showResult(data);
                // 공유 받고 들어온 경우엔 버튼 문구 살짝 변경
                const sBtn = document.getElementById('shareBtn');
                sBtn.innerText = "🌀 나도 분석 직접 해보기";
                sBtn.onclick = () => location.href = window.location.pathname;
            } catch(e) { console.error("Data error"); }
        }
    }
</script>
