<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 신비로운 인연 분석기 ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --mystic-purple: #6e57e0;
            --light-purple: #decaff;
            --deep-purple: #2a1b5d;
            --star-gold: #fff9c4;
            --bg-night: #1a1a2e;
        }
        body { font-family: 'Jua', sans-serif; background: var(--bg-night); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        /* 배경 별빛 효과 */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #2a1b5d 0%, #1a1a2e 100%);
            z-index: -1;
        }

        .container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: var(--light-purple); text-shadow: 0 0 10px var(--mystic-purple); margin-bottom: 30px; }
        
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid var(--mystic-purple); margin-bottom: 20px; }
        .section-title { color: var(--star-gold); margin-bottom: 15px; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        
        input, select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(0,0,0,0.3); color: white; margin-bottom: 10px; font-family: 'Jua'; box-sizing: border-box; }
        input::placeholder { color: #aaa; }
        .flex-row { display: flex; gap: 10px; }
        
        .agree-box { font-size: 0.9rem; color: var(--light-purple); text-align: center; margin: 20px 0; }
        .btn-submit { width: 100%; padding: 18px; background: linear-gradient(45deg, var(--mystic-purple), #a29bfe); color: white; border: none; border-radius: 20px; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 15px rgba(110, 87, 224, 0.4); transition: 0.3s; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 결과 화면 슬라이드 시스템 */
        #resultLayer { display: none; text-align: center; }
        .slide { display: none; animation: fadeIn 0.5s ease-in-out; text-align: left; }
        .slide.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--star-gold); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 20px; color: var(--star-gold); box-shadow: 0 0 20px rgba(255, 249, 196, 0.3); }
        
        .analysis-card { background: rgba(255,255,255,0.08); padding: 20px; border-radius: 20px; border-left: 4px solid var(--mystic-purple); margin-bottom: 20px; line-height: 1.8; font-size: 0.95rem; color: #eee; }
        .card-sub { color: var(--light-purple); font-size: 1.1rem; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }

        .nav-btns { display: flex; gap: 10px; margin-top: 25px; }
        .btn-nav { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--mystic-purple); background: transparent; color: white; cursor: pointer; font-family: 'Jua'; }
        .btn-nav.next { background: var(--mystic-purple); }
    </style>
</head>
<body>

<div class="container">
    <!-- 입력 레이어 -->
    <div id="inputLayer">
        <h1>✨ 운명의 성좌 분석 ✨</h1>
        <form id="loveForm" action="https://docs.google.com/forms/d/e/1FAIpQLSeKkP4HuJ5J4jW_XOrs2ryEpfSeuWn5VvbaOmMQhHKTmAxUpg/formResponse" method="POST" target="hidden_iframe">
            <div class="section">
                <div class="section-title">🔮 나의 우주</div>
                <input type="text" id="myName" placeholder="당신의 성함" required>
                <input type="text" id="myPhone" placeholder="휴대폰 번호 (01012345678)" required>
                <div class="flex-row">
                    <input type="date" id="myBirth" required>
                    <select id="myGender"><option value="남성">남성</option><option value="여성">여성</option></select>
                </div>
            </div>

            <div class="section">
                <div class="section-title">🌟 상대의 성좌</div>
                <input type="text" id="yourName" placeholder="상대방 성함" required>
                <input type="text" id="yourPhone" placeholder="상대방 번호" required>
                <div class="flex-row">
                    <input type="date" id="yourBirth">
                    <select id="yourGender"><option value="여성">여성</option><option value="남성">남성</option></select>
                </div>
            </div>

            <div class="agree-box">
                <input type="checkbox" id="agree" onchange="document.getElementById('submitBtn').disabled = !this.checked">
                천문의 흐름과 데이터 분석 활용에 동의합니다.
            </div>

            <!-- 구글 폼 히든 필드 -->
            <input type="hidden" name="entry.2059990547" id="gName">
            <input type="hidden" name="entry.669898893" id="gPhone">
            <input type="hidden" name="entry.708899075" id="gDetail">

            <button type="button" id="submitBtn" class="btn-submit" disabled onclick="handleAnalysis()">천기누설 시작하기 ✨</button>
        </form>
    </div>

    <!-- 결과 레이어 -->
    <div id="resultLayer">
        <h2 id="resTitle" style="color: var(--star-gold); margin-bottom: 5px;">인연 분석 리포트</h2>
        <p id="resSubtitle" style="font-size: 0.9rem; color: var(--light-purple); margin-bottom: 20px;"></p>
        
        <!-- 슬라이드 1: 점수 및 번호궁합 -->
        <div class="slide active" id="slide1">
            <div class="score-circle" id="resScore">0%</div>
            <div class="analysis-card">
                <div class="card-sub">🔢 수비학: 번호의 속삭임</div>
                <div id="numAnalysis"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav next" onclick="moveSlide(2)">사주 분석 보기 →</button>
            </div>
        </div>

        <!-- 슬라이드 2: 사주 및 성향 -->
        <div class="slide" id="slide2">
            <div class="analysis-card">
                <div class="card-sub" id="sajuTitle1"></div>
                <div id="sajuContent1"></div>
            </div>
            <div class="analysis-card">
                <div class="card-sub" id="sajuTitle2"></div>
                <div id="sajuContent2"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav" onclick="moveSlide(1)">← 이전</button>
                <button class="btn-nav next" onclick="moveSlide(3)">최종 조언 보기 →</button>
            </div>
        </div>

        <!-- 슬라이드 3: 총평 및 조언 -->
        <div class="slide" id="slide3">
            <div class="analysis-card" style="border-left-color: var(--star-gold);">
                <div class="card-sub">📍 운명의 총평</div>
                <div id="finalReview"></div>
            </div>
            <div class="analysis-card">
                <div class="card-sub">💡 관계를 위한 비책</div>
                <div id="finalAdvice"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav" onclick="moveSlide(2)">← 이전</button>
                <button class="btn-nav next" onclick="location.reload()">다시 하기 ↩️</button>
            </div>
        </div>
    </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    let currentSlide = 1;
    function moveSlide(n) {
        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
        document.getElementById('slide' + n).classList.add('active');
        window.scrollTo(0,0);
    }

    const tarotData = {
        1: { name: "Ace of Swords", mean: "새로운 확신과 진실", text: "날카로운 검의 끝처럼 명확한 이성과 결단력이 돋보이는 번호입니다. 상대에게 감춘 비밀보다는 투명한 진실을 요구하며, 한 번 결심하면 뒤를 돌아보지 않는 강인한 정신력을 상징합니다. 관계의 시작에서 주도권을 잡는 에너지가 매우 강합니다." },
        2: { name: "Two of Swords", mean: "갈등 속의 균형", text: "눈을 가리고 두 개의 검을 맞댄 채 평형을 유지하려는 긴장감이 느껴집니다. 현재 관계에 있어 선택을 유보하거나, 보고 싶지 않은 진실을 외면하려는 심리가 작용할 수 있습니다. 결정 장애를 극복하고 눈가리개를 벗는 용기가 필요합니다." },
        3: { name: "Three of Swords", mean: "비가 내리는 마음", text: "심장에 세 개의 검이 꽂힌 형국으로, 과거의 트라우마나 현재의 사소한 오해가 깊은 상처로 남을 수 있는 예민한 기운입니다. 감정적 소모가 클 수 있으니 서로의 언어적 표현에 있어 칼날을 숨겨야만 이 인연이 평온해질 수 있습니다." },
        4: { name: "Four of Swords", mean: "고요한 성찰", text: "격렬한 감정의 폭풍 후에 찾아온 일시적 휴식기입니다. 현재는 무언가 성급히 추진하기보다 서로의 거리를 두고 멘탈을 회복해야 하는 시기입니다. 정적인 에너지를 통해 상대의 소중함을 깨닫는 '명상의 시간'이 관계의 핵심입니다." },
        5: { name: "Five of Swords", mean: "상처뿐인 승리", text: "치열한 자존심 싸움과 갈등이 예상되는 번호입니다. 이기려 할수록 소중한 것을 잃게 되는 형국이니, 연인 사이에서 누가 옳은가를 따지기보다는 누가 더 사랑하는가를 고민해야 합니다. 패배가 곧 진정한 승리가 되는 오묘한 이치를 깨달아야 합니다." },
        6: { name: "Six of Swords", mean: "극복과 이동", text: "거친 파도를 지나 잔잔한 강물로 나아가는 치유의 기운입니다. 과거의 아픔이나 권태기를 극복하고 새로운 관계의 영역으로 함께 떠나는 긍정적인 변화를 상징합니다. 두 사람이 함께 노력하면 현재의 어려운 상황은 금새 호전될 것입니다." },
        7: { name: "Seven of Swords", mean: "전략적 거리", text: "몰래 칼을 훔쳐 떠나는 기사처럼, 서로에게 100% 솔직하기보다는 각자의 전략이나 숨겨진 의도가 있을 수 있습니다. 가벼운 밀당은 재미를 주지만, 지나친 책략은 불신을 낳습니다. 조금 더 담백하고 진정성 있는 태도가 요구됩니다." },
        8: { name: "Eight of Swords", mean: "스스로 만든 구속", text: "눈이 가려진 채 검들에 둘러싸인 모습은, 외부의 압박보다는 본인의 불안감이 스스로를 고립시키고 있음을 나타냅니다. 상대방이 당신을 구속하는 것이 아니라, 당신 스스로가 만든 의심이 당신을 묶고 있습니다. 생각을 단순화하면 해결책이 보입니다." },
        9: { name: "Nine of Swords", mean: "밤의 불면증", text: "생각이 너무 많아 밤잠을 설치고 괴로워하는 기운입니다. 일어나지도 않은 일에 대한 걱정과 죄책감이 관계를 무겁게 짓누릅니다. 정신적 피로도를 낮추고, 침대에 누워 고민하는 대신 상대의 손을 한 번 더 잡는 실천이 필요합니다." },
        0: { name: "Ten of Swords", mean: "끝과 새로운 여명", text: "바닥까지 내려간 상황, 즉 인내의 한계치에 도달한 번호입니다. 하지만 이는 곧 고통의 끝을 의미하며, 이제는 다시 올라갈 일만 남았음을 뜻합니다. 낡은 관계의 패턴을 완전히 파괴해야만 새로운 태양이 떠오를 것입니다." }
    };

    function getSajuDesc(name, birth, gender, pLast) {
        if(!birth) return "상대방의 생년월일이 신비에 싸여 있어 번호 수비학을 중심으로 분석을 진행했습니다. 하지만 번호 끝자리의 기운만 보더라도 범상치 않은 존재감을 내뿜고 있군요.";
        
        const month = parseInt(birth.split('-')[1]);
        const day = parseInt(birth.split('-')[2]);
        let base = "";
        
        if([3,4,5].includes(month)) base = `${name}님은 '목(木)'의 기운을 품은 봄의 아이로, 굽히지 않는 나무처럼 곧고 강직한 성정을 지녔습니다. 타인에게 지시받기보다 주도적으로 관계를 이끌 때 가장 빛나는 매력을 발산하며, 호기심이 많아 사랑에 있어서도 늘 새로운 자극을 추구하는 편입니다.`;
        else if([6,7,8].includes(month)) base = `${name}님은 '화(火)'의 기운이 절정에 달한 여름의 영혼입니다. 열정적이고 화끈한 성격 뒤에 깊은 외로움을 숨기고 있으며, 사람들의 관심을 먹고 사는 다정한 리더의 기질이 있습니다. 연애에 있어서는 불꽃처럼 뜨겁게 타오르는 순수함을 보입니다.`;
        else if([9,10,11].includes(month)) base = `${name}님은 결실의 계절인 가을의 '금(金)' 기운을 타고났습니다. 맺고 끊음이 확실하며, 현실적이고 이성적인 판단력이 매우 뛰어납니다. 차가워 보일 수 있으나 속정은 누구보다 깊으며, 한 번 신뢰한 사람에게는 끝없는 의리를 보여주는 스타일입니다.`;
        else base = `${name}님은 만물이 침잠하는 겨울의 '수(水)' 기운을 가졌습니다. 지혜롭고 유연하며, 겉으로는 고요해 보이나 속으로는 수만 가지 생각을 품고 있는 깊은 바다와 같습니다. 상대의 기분을 세심하게 살피는 공감 능력이 탁월하지만, 본인의 상처는 쉽게 드러내지 않는 신비로움이 있습니다.`;

        let extra = `\n\n올해 흐름을 보면, 현재 사용하는 번호의 끝자리 '${pLast}'번이 ${gender === '여성' ? '연애운(관성)' : '애정운(재성)'}과 절묘한 합(合)을 이루고 있어, 정적인 관계보다는 역동적인 소통이 오갈 때 인연의 끈이 더욱 단단해지는 형국입니다. 특히 식신(食神)의 기운이 강하게 작용하여, 함께 맛있는 것을 먹거나 공동의 취미를 배울 때 복이 들어오는 사주입니다.`;
        
        return base + extra;
    }

    function handleAnalysis() {
        const n1 = document.getElementById('myName').value;
        const p1 = document.getElementById('myPhone').value.replace(/[^0-9]/g, '');
        const b1 = document.getElementById('myBirth').value;
        const g1 = document.getElementById('myGender').value;
        const n2 = document.getElementById('yourName').value;
        const p2 = document.getElementById('yourPhone').value.replace(/[^0-9]/g, '');
        const b2 = document.getElementById('yourBirth').value;
        const g2 = document.getElementById('yourGender').value;

        document.getElementById('gName').value = `${n1} | ${n2}`;
        document.getElementById('gPhone').value = `${p1} | ${p2}`;
        document.getElementById('gDetail').value = `본인:${b1}/${g1} 상대:${b2||'모름'}/${g2}`;
        document.getElementById('loveForm').submit();

        showResult(n1, p1, b1, g1, n2, p2, b2, g2);
    }

    function showResult(n1, p1, b1, g1, n2, p2, b2, g2) {
        document.getElementById('resSubtitle').innerText = `${n1}님과 ${n2}님의 천문 결합 분석 데이터`;
        
        const p1Last = parseInt(p1.slice(-1));
        const p2Last = parseInt(p2.slice(-1));
        const t1 = tarotData[p1Last];
        const t2 = tarotData[p2Last];

        // 수비학 상세 분석 (분량 5배)
        document.getElementById('numAnalysis').innerHTML = `
            <p><strong>[${n1}님: ${t1.name} - ${t1.mean}]</strong><br>${t1.text}</p><hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;">
            <p><strong>[${n2}님: ${t2.name} - ${t2.mean}]</strong><br>${t2.text}</p>
        `;

        // 사주 상세 분석 (상대방 포함)
        document.getElementById('sajuTitle1').innerText = `👤 ${n1}님의 사주 분석`;
        document.getElementById('sajuContent1').innerText = getSajuDesc(n1, b1, g1, p1Last);
        document.getElementById('sajuTitle2').innerText = `👤 ${n2}님의 사주 분석`;
        document.getElementById('sajuContent2').innerText = getSajuDesc(n2, b2, g2, p2Last);

        // 점수 계산
        let score = 75 + (p1Last % 5) + (p2Last % 5);
        if(p1Last === p2Last) score += 10;
        document.getElementById('resScore').innerText = score + "%";

        // 마지막 총평 및 조언 (대폭 확장)
        let review = `두 분의 인연은 '${score}%'라는 수치 이상의 깊은 서사를 담고 있습니다. ${n1}님의 '${t1.name}' 기운과 ${n2}님의 '${t2.name}' 기운이 만났을 때 생겨나는 시너지는 '이성적 긴장감'과 '현실적 보완'이라는 키워드로 요약됩니다. 겉으로 보기엔 서로 다른 성격처럼 보일 수 있으나, 위기의 순간에 발휘되는 두 분의 합심력은 그 어떤 커플보다 강력합니다. 특히 사주의 오행이 서로의 부족한 부분을 채워주는 상생(相生)의 구조를 띠고 있어, 한쪽이 지칠 때 다른 쪽이 등대가 되어줄 수 있는 아주 귀한 인연의 배치입니다.`;
        
        let advice = `1. **잘 맞는 점**: 두 분은 각자의 주관이 뚜렷하면서도 결정적인 순간에는 서로의 지혜를 존중하는 '상호 존중'의 미덕이 큽니다. 특히 공통의 목표(일, 공부, 여행 등)가 있을 때 그 시너지는 배가 됩니다.\n\n2. **조심해야 할 점**: 양쪽 모두 번호 속에 '검(Swords)'의 기운이 강합니다. 서운함이 생겼을 때 이를 곱씹기보다는 즉각적으로, 하지만 차분하게 대화로 풀어야 합니다. 침묵은 독이 될 수 있습니다.\n\n3. **더 좋은 관계를 위한 비책**: 가끔은 진지한 분석보다 감성적인 교감을 우선시하세요. 매칭된 수비학적 기운을 완화하기 위해 함께 '해질녘 산책'이나 '물 관련 장소'를 방문하는 것이 기운을 순화시키는 데 큰 도움이 됩니다. 서로의 '말 한마디'가 가장 큰 보약이자 독약임을 기억하고 섬세하게 상대를 보듬는다면, 이 인연은 시간이 흐를수록 금강석처럼 단단해질 것입니다.`;

        document.getElementById('finalReview').innerText = review;
        document.getElementById('finalAdvice').innerText = advice;

        document.getElementById('inputLayer').style.display = 'none';
        document.getElementById('resultLayer').style.display = 'block';
    }
</script>
