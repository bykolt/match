<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 정밀 번호 궁합 분석기 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root { --main-pink: #ffb7c5; --dark-pink: #ff8fa3; --bg-pink: #fff5f7; --deep-blue: #4a6fa5; }
        body { font-family: 'Jua', sans-serif; background-color: var(--bg-pink); color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); width: 100%; max-width: 450px; }
        h1 { text-align: center; color: var(--dark-pink); margin-bottom: 25px; font-size: 1.6rem; }
        
        .section { border: 2px dashed var(--main-pink); padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .section-title { font-size: 1.1rem; color: var(--dark-pink); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-family: 'Jua', sans-serif; margin-bottom: 10px; font-size: 1rem; }
        .flex-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .checkbox-group { display: flex; align-items: center; font-size: 0.85rem; gap: 5px; color: #888; margin-top: -5px; margin-bottom: 10px; }
        .checkbox-group input { width: auto; margin: 0; }

        .agree-box { font-size: 0.85rem; color: #666; background: #f9f9f9; padding: 12px; border-radius: 10px; margin: 20px 0; }
        
        .btn-submit { width: 100%; padding: 18px; background: var(--main-pink); color: white; border: none; border-radius: 15px; font-size: 1.4rem; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 0 #fb9ba7; }
        .btn-submit:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

        /* 결과 레이어 */
        #resultLayer { display: none; }
        .result-header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--bg-pink); }
        .names { font-size: 1.3rem; color: #555; }
        .score-wrap { text-align: center; margin: 20px 0; }
        .score-label { font-size: 1rem; color: #999; }
        .score { font-size: 4.5rem; color: var(--dark-pink); line-height: 1; }
        
        .analysis-box { background: #fdfdfd; border-radius: 15px; border: 1px solid #eee; padding: 18px; margin-bottom: 15px; }
        .analysis-title { font-size: 1rem; color: var(--deep-blue); margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .analysis-content { font-size: 0.92rem; line-height: 1.6; color: #444; white-space: pre-wrap; }
        
        .btn-retry { width: 100%; height: 50px; background: #f2f2f2; color: #888; border: none; border-radius: 12px; cursor: pointer; font-family: 'Jua'; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="inputLayer">
        <h1>💖 번호 궁합 분석기 💖</h1>
        <form id="loveForm" action="https://docs.google.com/forms/d/e/1FAIpQLSeKkP4HuJ5J4jW_XOrs2ryEpfSeuWn5VvbaOmMQhHKTmAxUpg/formResponse" method="POST" target="hidden_iframe">
            <div class="section">
                <div class="section-title">👤 나의 정보</div>
                <input type="text" id="myName" placeholder="나의 이름" required>
                <input type="text" id="myPhone" placeholder="전화번호 (01012345678)" required>
                <div class="flex-row">
                    <input type="date" id="myBirth" required>
                    <select id="myGender"><option value="남성">남성</option><option value="여성">여성</option></select>
                </div>
                <input type="time" id="myTime">
            </div>

            <div class="section">
                <div class="section-title">💕 상대방 정보</div>
                <input type="text" id="yourName" placeholder="상대방 이름" required>
                <input type="text" id="yourPhone" placeholder="상대방 전화번호" required>
                <div class="flex-row">
                    <input type="date" id="yourBirth" id="yourBirth">
                    <select id="yourGender"><option value="여성">여성</option><option value="남성">남성</option></select>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="birthUnknown" onchange="document.getElementById('yourBirth').disabled = this.checked">
                    <label for="birthUnknown">생일 모름</label>
                </div>
            </div>

            <div class="agree-box">
                <input type="checkbox" id="agree" onchange="document.getElementById('submitBtn').disabled = !this.checked">
                (필수) 데이터 분석 및 개인정보 활용에 동의합니다.
            </div>

            <input type="hidden" name="entry.2059990547" id="gName">
            <input type="hidden" name="entry.669898893" id="gPhone">
            <input type="hidden" name="entry.708899075" id="gDetail">

            <button type="button" id="submitBtn" class="btn-submit" disabled onclick="handleAnalysis()">결과 분석하기 ✨</button>
        </form>
    </div>

    <!-- 결과 창 -->
    <div id="resultLayer">
        <div class="result-header">
            <div class="names"><span id="resNames" style="color:var(--dark-pink)"></span> 님의</div>
            <h1 style="margin:5px 0;">통합 매칭 분석 보고서</h1>
        </div>
        
        <div class="score-wrap">
            <div class="score-label">종합 인연 지수</div>
            <div class="score" id="resScore">0%</div>
        </div>

        <div class="analysis-box">
            <div class="analysis-title">🔢 수비학 번호 궁합 (Tarot Numerology)</div>
            <div class="analysis-content" id="numAnalysis"></div>
        </div>

        <div class="analysis-box" style="border-color: #ffe4e8;">
            <div class="analysis-title" style="color: #d63384;">☯️ 사주 및 성향 분석</div>
            <div class="analysis-content" id="sajuAnalysis"></div>
        </div>

        <div class="analysis-box">
            <div class="analysis-title">📍 총평 및 관계 조언</div>
            <div class="analysis-content" id="finalAdvice"></div>
        </div>

        <button class="btn-retry" onclick="location.reload()">새로운 매칭 분석하기 ↩️</button>
    </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    const tarotData = {
        0: { title: "10. Ten of Swords (결말/인과)", desc: "두 분의 번호는 하나의 주기가 끝나고 새로운 단계로 넘어가는 강렬한 에너지를 보입니다. 때로는 관계의 끝을 경험할 수도 있으나, 이는 더 이상 내려갈 곳 없는 새로운 시작을 의미합니다." },
        1: { title: "1. Ace of Swords (확신/결단)", desc: "명확함과 새로운 생각의 시작을 의미합니다. 두 사람 사이에는 숨김없는 대화가 중요하며, 결단력이 관계의 키포인트가 될 것입니다." },
        2: { title: "2. Two of Swords (균형/방어)", desc: "현재 두 분 사이에는 팽팽한 긴장감과 균형이 존재합니다. 진실을 보기 위해 눈가리개를 벗어야 할 시점이며, 결정 장애를 극복해야 관계가 발전합니다." },
        3: { title: "3. Three of Swords (슬픔/오해)", desc: "감성적인 상처나 오해가 발생하기 쉬운 번호 조합입니다. 날카로운 언행으로 가슴 아픈 이별을 겪을 수 있으니 언행에 각별한 주의가 필요합니다." },
        4: { title: "4. Four of Swords (성찰/휴식)", desc: "격렬한 감정보다는 잠시 멈추어 휴식과 내면의 안정을 찾는 관계입니다. 갈등이 있었다면 지금은 회복과 명상의 시간이 필요한 시기입니다." },
        5: { title: "5. Five of Swords (갈등/패배)", desc: "서로 이기기 위한 싸움이 잦을 수 있습니다. 승리하더라도 상처뿐일 수 있으니, 고집을 꺾고 패배를 인정하는 배려가 요구됩니다." },
        6: { title: "6. Six of Swords (극복/이동)", desc: "힘든 시기를 지나 함께 안정을 찾아가는 과정에 있습니다. 과거의 상처를 뒤로하고 더 나은 미래로 함께 항해하는 긍정적인 변화의 흐름입니다." },
        7: { title: "7. Seven of Swords (전략/신중)", desc: "솔직하지 못한 소통이 관계의 걸림돌입니다. 상대방에게 도망치고 싶은 심리가 생기지 않도록 서로를 구속하기보다 신뢰를 쌓는 전략이 필요합니다." },
        8: { title: "8. Eight of Swords (불안/구속)", desc: "서로가 만들어낸 생각의 감옥에 갇혀 무력감을 느낄 수 있습니다. 두려움을 버리고 스스로 결박을 풀어야만 답답한 연애에서 벗어날 수 있습니다." },
        9: { title: "9. Nine of Swords (악몽/고민)", desc: "불필요한 걱정과 밤잠을 설치는 정신적 고통이 동반될 수 있는 조합입니다. 현실보다 과장된 불안에 휘둘리지 않도록 내면의 단단함이 중요합니다." }
    };

    function handleAnalysis() {
        const n1 = document.getElementById('myName').value;
        const p1 = document.getElementById('myPhone').value.replace(/[^0-9]/g, '');
        const b1 = document.getElementById('myBirth').value;
        const g1 = document.getElementById('myGender').value;

        const n2 = document.getElementById('yourName').value;
        const p2 = document.getElementById('yourPhone').value.replace(/[^0-9]/g, '');
        const b2 = document.getElementById('yourBirth').value;
        const g2 = document.getElementById('yourGender').value;

        if(!n1 || !p1 || !b1 || !n2 || !p2) { alert("모든 항목을 입력해 주세요!"); return; }
        if(p1.length < 11 || p2.length < 11) { alert("번호 11자리를 확인해 주세요."); return; }

        // 데이터 전송 준비
        document.getElementById('gName').value = `${n1} | ${n2}`;
        document.getElementById('gPhone').value = `${p1} | ${p2}`;
        document.getElementById('gDetail').value = `본인: ${b1}/${g1} | 상대: ${b2 || '모름'}/${g2}`;
        document.getElementById('loveForm').submit();

        // 결과 생성
        showResult(n1, p1, b1, g1, n2, p2, b2, g2);
    }

    function showResult(n1, p1, b1, g1, n2, p2, b2, g2) {
        document.getElementById('resNames').innerText = `${n1} & ${n2}`;
        
        // 1. 번호 분석 (끝자리 기반 타로)
        const p1Last = parseInt(p1.slice(-1));
        const p2Last = parseInt(p2.slice(-1));
        const t1 = tarotData[p1Last];
        const t2 = tarotData[p2Last];
        
        document.getElementById('numAnalysis').innerText = `[${n1}님: ${t1.title}]\n${t1.desc}\n\n[${n2}님: ${t2.title}]\n${t2.desc}`;

        // 2. 사주 분석 (생일 기반 로직)
        const month = parseInt(b1.split('-')[1]);
        let sajuText = "";
        if([3,4,5].includes(month)) sajuText = `${n1}님은 봄의 목(木) 기운을 타고나 추진력과 호기심이 강합니다. `;
        else if([6,7,8].includes(month)) sajuText = `${n1}님은 여름의 화(火) 기운으로 열정적이며 솔직한 매력이 돋보입니다. `;
        else if([9,10,11].includes(month)) sajuText = `${n1}님은 가을의 금(金) 기운을 가져 냉철하면서도 의리가 강한 성품입니다. `;
        else sajuText = `${n1}님은 겨울의 수(水) 기운으로 차분하며 속이 깊고 신중한 성격입니다. `;

        sajuText += `\n현재 ${g1 === '여성' ? '관운(남편운)' : '재성(아내운)'}의 흐름이 전화번호의 숫자 '${p1Last}'번과 결합되어 `;
        if(p1Last % 2 === 0) sajuText += "안정적이고 수동적인 연애보다는 역동적인 소통이 필요한 운때입니다.";
        else sajuText += "적극적인 흐름 속에서 주체적인 관계를 형성하는 운세가 들어와 있습니다.";

        document.getElementById('sajuAnalysis').innerText = sajuText;

        // 3. 총평 및 점수
        let finalScore = 70 + (p1Last + p2Last);
        if(p1Last === p2Last) finalScore += 15;
        if(finalScore > 98) finalScore = 98;
        
        document.getElementById('resScore').innerText = finalScore + "%";
        
        let advice = "";
        if(finalScore >= 90) advice = "두 분은 전생의 서사가 완벽히 정돈된 듯한 '지천명'의 궁합입니다. 서로의 신뢰만 있다면 무너지지 않는 성벽 같은 연인입니다.";
        else if(finalScore >= 80) advice = "현실적인 조율이 필요한 인연입니다. 숫자의 기운이 서로 보완하는 관계이니, 대화의 논점만 흐리지 않는다면 장기적 발전이 가능합니다.";
        else advice = "서로의 다름을 인정하는 것이 최우선 과제입니다. 매력은 강하지만 갈등의 폭도 깊을 수 있으니, 상대방의 영역을 존중하는 배려가 필실적입니다.";
        
        document.getElementById('finalAdvice').innerText = advice;

        // 화면 전환
        document.getElementById('inputLayer').style.display = 'none';
        document.getElementById('resultLayer').style.display = 'block';
        window.scrollTo(0,0);
    }
</script>
</body>
</html>
