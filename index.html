<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 신비로운 인연 분석기 ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --mystic-purple: #6e57e0;
            --light-purple: #decaff;
            --deep-purple: #2a1b5d;
            --star-gold: #fff9c4;
            --bg-night: #1a1a2e;
        }
        body { font-family: 'Jua', sans-serif; background: var(--bg-night); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #2a1b5d 0%, #1a1a2e 100%);
            z-index: -1;
        }

        .container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: var(--light-purple); text-shadow: 0 0 10px var(--mystic-purple); margin-bottom: 30px; }
        
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid var(--mystic-purple); margin-bottom: 20px; }
        .section-title { color: var(--star-gold); margin-bottom: 15px; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        
        label { display: block; font-size: 0.85rem; color: var(--light-purple); margin-bottom: 5px; margin-left: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(0,0,0,0.3); color: white; margin-bottom: 12px; font-family: 'Jua'; box-sizing: border-box; font-size: 1rem; }
        input::placeholder { color: #aaa; }
        .flex-row { display: flex; gap: 10px; align-items: flex-end; }
        .flex-item { flex: 1; }
        
        .checkbox-group { display: flex; align-items: center; font-size: 0.8rem; gap: 5px; color: #ccc; margin-top: -8px; margin-bottom: 10px; }
        .checkbox-group input { width: auto; margin: 0; height: 14px; }

        .agree-box { font-size: 0.9rem; color: var(--light-purple); text-align: center; margin: 20px 0; }
        .btn-submit { width: 100%; padding: 18px; background: linear-gradient(45deg, var(--mystic-purple), #a29bfe); color: white; border: none; border-radius: 20px; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 15px rgba(110, 87, 224, 0.4); transition: 0.3s; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        #resultLayer { display: none; text-align: center; }
        .slide { display: none; animation: fadeIn 0.5s ease-in-out; text-align: left; }
        .slide.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--star-gold); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 20px; color: var(--star-gold); box-shadow: 0 0 20px rgba(255, 249, 196, 0.3); }
        
        .analysis-card { background: rgba(255,255,255,0.08); padding: 20px; border-radius: 20px; border-left: 4px solid var(--mystic-purple); margin-bottom: 20px; line-height: 1.8; font-size: 0.95rem; color: #eee; white-space: pre-wrap; }
        .card-sub { color: var(--light-purple); font-size: 1.1rem; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }

        .nav-btns { display: flex; gap: 10px; margin-top: 25px; }
        .btn-nav { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--mystic-purple); background: transparent; color: white; cursor: pointer; font-family: 'Jua'; }
        .btn-nav.next { background: var(--mystic-purple); }
    </style>
</head>
<body>

<div class="container">
    <!-- 입력 레이어 -->
    <div id="inputLayer">
        <h1>✨ 운명의 성좌 분석 ✨</h1>
        <form id="loveForm" action="https://docs.google.com/forms/d/e/1FAIpQLSeKkP4HuJ5J4jW_XOrs2ryEpfSeuWn5VvbaOmMQhHKTmAxUpg/formResponse" method="POST" target="hidden_iframe">
            <div class="section">
                <div class="section-title">🔮 나의 우주</div>
                <input type="text" id="myName" placeholder="당신의 성함" required>
                <input type="text" id="myPhone" placeholder="휴대폰 번호 (01012345678)" required>
                <div class="flex-row">
                    <div class="flex-item"><label>생년월일</label><input type="date" id="myBirth" required></div>
                    <div class="flex-item"><label>태어난 시간</label><input type="time" id="myTime"></div>
                </div>
                <select id="myGender"><option value="남성">남성</option><option value="여성">여성</option></select>
            </div>

            <div class="section">
                <div class="section-title">🌟 상대의 성좌</div>
                <input type="text" id="yourName" placeholder="상대방 성함" required>
                <input type="text" id="yourPhone" placeholder="상대방 번호" required>
                <div class="flex-row">
                    <div class="flex-item"><label>생년월일</label><input type="date" id="yourBirth"></div>
                    <div class="flex-item"><label>태어난 시간</label><input type="time" id="yourTime"></div>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="birthUnknown" onchange="document.getElementById('yourBirth').disabled = this.checked; document.getElementById('yourTime').disabled = this.checked;">
                    <label for="birthUnknown">상대방 정보 모름</label>
                </div>
                <select id="yourGender"><option value="여성">여성</option><option value="남성">남성</option></select>
            </div>

            <div class="agree-box">
                <input type="checkbox" id="agree" onchange="document.getElementById('submitBtn').disabled = !this.checked">
                천문의 흐름과 데이터 분석 활용에 동의합니다.
            </div>

            <input type="hidden" name="entry.2059990547" id="gName">
            <input type="hidden" name="entry.669898893" id="gPhone">
            <input type="hidden" name="entry.708899075" id="gDetail">

            <button type="button" id="submitBtn" class="btn-submit" disabled onclick="handleAnalysis()">천기누설 시작하기 ✨</button>
        </form>
    </div>

    <!-- 결과 레이어 -->
    <div id="resultLayer">
        <h2 id="resTitle" style="color: var(--star-gold); margin-bottom: 5px;">인연 분석 리포트</h2>
        <p id="resSubtitle" style="font-size: 0.9rem; color: var(--light-purple); margin-bottom: 20px;"></p>
        
        <div class="slide active" id="slide1">
            <div class="score-circle" id="resScore">0%</div>
            <div class="analysis-card">
                <div class="card-sub">🔢 수비학: 번호의 속삭임</div>
                <div id="numAnalysis"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav next" onclick="moveSlide(2)">사주 분석 보기 →</button>
            </div>
        </div>

        <div class="slide" id="slide2">
            <div class="analysis-card">
                <div class="card-sub" id="sajuTitle1"></div>
                <div id="sajuContent1"></div>
            </div>
            <div class="analysis-card">
                <div class="card-sub" id="sajuTitle2"></div>
                <div id="sajuContent2"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav" onclick="moveSlide(1)">← 이전</button>
                <button class="btn-nav next" onclick="moveSlide(3)">최종 조언 보기 →</button>
            </div>
        </div>

        <div class="slide" id="slide3">
            <div class="analysis-card" style="border-left-color: var(--star-gold);">
                <div class="card-sub">📍 운명의 총평</div>
                <div id="finalReview"></div>
            </div>
            <div class="analysis-card">
                <div class="card-sub">💡 관계를 위한 비책</div>
                <div id="finalAdvice"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav" onclick="moveSlide(2)">← 이전</button>
                <button class="btn-nav next" onclick="location.reload()">다시 하기 ↩️</button>
            </div>
        </div>
    </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    function moveSlide(n) {
        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
        document.getElementById('slide' + n).classList.add('active');
        window.scrollTo(0,0);
    }

    const tarotData = {
        1: { name: "Ace of Swords", mean: "새로운 확신과 진실", text: "날카로운 검의 끝처럼 명확한 이성과 결단력이 돋보이는 번호입니다. 상대에게 감춘 비밀보다는 투명한 진실을 요구하며, 결단력이 관계의 주도권을 결정합니다." },
        2: { name: "Two of Swords", mean: "갈등 속의 균형", text: "긴장감과 평형을 상징합니다. 현재 상황에서 선택을 유보하거나 진실을 외면하려는 심리가 작용할 수 있으니 눈가리개를 벗는 용기가 필요합니다." },
        3: { name: "Three of Swords", mean: "비가 내리는 마음", text: "날카로운 오해가 상처로 남을 수 있는 기운입니다. 사소한 말 한마디가 관계를 흔들 수 있으니 따뜻한 언어 선택이 인연의 평온을 결정합니다." },
        4: { name: "Four of Swords", mean: "고요한 성찰", text: "휴식과 회복의 시기입니다. 성급히 추진하기보다 거리를 가짐으로써 상대의 소중함을 깨닫는 명상의 기운이 관계의 키워드입니다." },
        5: { name: "Five of Swords", mean: "상처뿐인 승리", text: "자존심 싸움이 예상됩니다. 이기려 할수록 소중한 것을 잃기 쉬우니 고집보다는 배려를 선택해야 진정한 인연을 지킬 수 있습니다." },
        6: { name: "Six of Swords", mean: "극복과 이동", text: "과거의 아픔을 뒤로하고 안정적인 미래로 나아가는 기운입니다. 함께 노력하면 현재의 난관을 극복하고 새로운 행복의 영역으로 진입하게 됩니다." },
        7: { name: "Seven of Swords", mean: "전략적 신중함", text: "서로에게 100% 솔직하기보다 가벼운 책략이나 의도가 숨어있을 수 있습니다. 지나친 밀당은 불신을 낳으니 담백한 진정성이 요구됩니다." },
        8: { name: "Eight of Swords", mean: "스스로 만든 구속", text: "불안감이 스스로를 고립시키고 있습니다. 상대의 구속이 아닌 본인의 의심이 당신을 묶고 있을 확률이 크니 생각을 단순하게 정리해야 합니다." },
        9: { name: "Nine of Swords", mean: "밤의 고통스러운 고민", text: "불면증과 걱정을 상징합니다. 일어나지 않은 일에 대한 죄책감이나 불안에 휘둘리지 말고 상대의 손을 한 번 더 잡는 실천이 필요합니다." },
        0: { name: "Ten of Swords", mean: "끝과 새로운 여명", text: "인내의 한계치에 도달했으나 이는 곧 고통의 끝을 의미합니다. 낡은 관계의 패턴을 파괴해야만 밝은 태양이 뜨는 새로운 시작을 맞이합니다." }
    };

    function getSajuDesc(name, birth, time, gender, pLast) {
        if(!birth) return "상대방의 데이터가 우주 너머에 있어 번호 수비학 분석에 집중했습니다.";
        const month = parseInt(birth.split('-')[1]);
        const timeVal = time || "시간 모름";
        let base = "";
        
        if([3,4,5].includes(month)) base = `${name}님은 봄의 '목(木)' 기운을 지닌 분입니다. `;
        else if([6,7,8].includes(month)) base = `${name}님은 여름의 '화(火)' 기운을 지닌 분입니다. `;
        else if([9,10,11].includes(month)) base = `${name}님은 가을의 '금(金)' 기운을 지닌 분입니다. `;
        else base = `${name}님은 겨울의 '수(水)' 기운을 지닌 지혜로운 분입니다. `;

        return `${base}\n${name}님은 태어난 시간(${timeVal})의 신비로운 정기를 타고나셨군요. 타고난 사주의 흐름과 현재 번호의 '${pLast}'번 기운이 결합되어 ${gender === '여성' ? '연애운' : '애정운'}에 있어 매우 다이나믹하면서도 상호 보완적인 흐름을 형성하고 있습니다. 특히 사주 상의 '비견'과 '식신'의 존재가 뚜렷하여 상대방을 향한 애정이 깊으면서도 본인만의 명확한 배움과 인생관을 공유할 때 인연의 끈이 더욱 단단해지는 형국입니다.`;
    }

    function handleAnalysis() {
        const n1 = document.getElementById('myName').value;
        const p1 = document.getElementById('myPhone').value.replace(/[^0-9]/g, '');
        const b1 = document.getElementById('myBirth').value;
        const t1 = document.getElementById('myTime').value;
        const g1 = document.getElementById('myGender').value;

        const n2 = document.getElementById('yourName').value;
        const p2 = document.getElementById('yourPhone').value.replace(/[^0-9]/g, '');
        const b2 = document.getElementById('yourBirth').value;
        const t2 = document.getElementById('yourTime').value;
        const g2 = document.getElementById('yourGender').value;

        document.getElementById('gName').value = `${n1} | ${n2}`;
        document.getElementById('gPhone').value = `${p1} | ${p2}`;
        document.getElementById('gDetail').value = `본인:${b1}(${t1})/${g1} | 상대:${b2}(${t2})/${g2}`;
        document.getElementById('loveForm').submit();

        showResult(n1, p1, b1, t1, g1, n2, p2, b2, t2, g2);
    }

    function showResult(n1, p1, b1, t1, g1, n2, p2, b2, t2, g2) {
        document.getElementById('resSubtitle').innerText = `${n1} & ${n2} 님의 천문 분석 결과`;
        const p1Last = parseInt(p1.slice(-1));
        const p2Last = parseInt(p2.slice(-1));
        const tarot1 = tarotData[p1Last];
        const tarot2 = tarotData[p2Last];

        document.getElementById('numAnalysis').innerHTML = `<strong>[${n1}님: ${tarot1.name}]</strong><br>${tarot1.text}<br><br><strong>[${n2}님: ${tarot2.name}]</strong><br>${tarot2.text}`;
        
        document.getElementById('sajuTitle1').innerText = `👤 ${n1}님의 운명 분석`;
        document.getElementById('sajuContent1').innerText = getSajuDesc(n1, b1, t1, g1, p1Last);
        document.getElementById('sajuTitle2').innerText = `👤 ${n2}님의 운명 분석`;
        document.getElementById('sajuContent2').innerText = getSajuDesc(n2, b2, t2, g2, p2Last);

        let score = 75 + (p1Last % 5) + (p2Last % 5);
        if(p1Last === p2Last) score += 10;
        document.getElementById('resScore').innerText = score + "%";

        document.getElementById('finalReview').innerText = `두 분의 인연은 '${score}%'로, ${n1}님의 이성과 ${n2}님의 감성이 교차하는 지점이 매우 신비롭게 형성되어 있습니다. 사주 상의 시너지가 강력하여 갈등이 있더라도 대화 한 번에 금방 눈 녹듯 사라지는 인연입니다.`;
        document.getElementById('finalAdvice').innerText = `1. 잘 맞는 점: 서로를 향한 배려심이 깊고 공동의 배움을 즐깁니다.\n2. 조심할 점: 가끔은 고립되려 하지 말고 솔직히 대화하세요.\n3. 비책: 밤 산책이나 함께 새로운 장소를 방문하여 정체된 기운을 환기시키면 관계가 더 깊어집니다.`;

        document.getElementById('inputLayer').style.display = 'none';
        document.getElementById('resultLayer').style.display = 'block';
    }
</script>
</body>
</html>
