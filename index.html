<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 신비로운 인연 분석기 ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --mystic-purple: #6e57e0;
            --light-purple: #decaff;
            --deep-purple: #2a1b5d;
            --star-gold: #fff9c4;
            --bg-night: #1a1a2e;
        }
        body { font-family: 'Jua', sans-serif; background: var(--bg-night); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #2a1b5d 0%, #1a1a2e 100%);
            z-index: -1;
        }

        .container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: var(--light-purple); text-shadow: 0 0 10px var(--mystic-purple); margin-bottom: 30px; }
        
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid var(--mystic-purple); margin-bottom: 20px; }
        .section-title { color: var(--star-gold); margin-bottom: 15px; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        
        label { display: block; font-size: 0.85rem; color: var(--light-purple); margin-bottom: 5px; margin-left: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(0,0,0,0.3); color: white; margin-bottom: 12px; font-family: 'Jua'; box-sizing: border-box; font-size: 1rem; }
        
        .flex-row { display: flex; gap: 10px; align-items: flex-end; }
        .flex-item { flex: 1; }
        
        .checkbox-group { display: flex; align-items: center; font-size: 0.8rem; gap: 5px; color: #ccc; margin-top: -8px; margin-bottom: 10px; }
        .checkbox-group input { width: auto; margin: 0; height: 14px; }

        .agree-box { font-size: 0.9rem; color: var(--light-purple); text-align: center; margin: 20px 0; }
        .btn-submit { width: 100%; padding: 18px; background: linear-gradient(45deg, var(--mystic-purple), #a29bfe); color: white; border: none; border-radius: 20px; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 15px rgba(110, 87, 224, 0.4); transition: 0.3s; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        #resultLayer { display: none; text-align: center; }
        .slide { display: none; animation: fadeIn 0.5s ease-in-out; text-align: left; }
        .slide.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--star-gold); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 20px; color: var(--star-gold); box-shadow: 0 0 20px rgba(255, 249, 196, 0.3); background: rgba(0,0,0,0.2); }
        
        .analysis-card { background: rgba(255,255,255,0.08); padding: 20px; border-radius: 20px; border-left: 4px solid var(--mystic-purple); margin-bottom: 20px; line-height: 1.8; font-size: 0.95rem; color: #eee; white-space: pre-wrap; word-break: keep-all; }
        .card-sub { color: var(--star-gold); font-size: 1.1rem; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }

        .nav-btns { display: flex; gap: 10px; margin-top: 25px; flex-wrap: wrap; }
        .btn-nav { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--mystic-purple); background: rgba(110, 87, 224, 0.2); color: white; cursor: pointer; font-family: 'Jua'; min-width: 120px; transition: 0.3s; }
        .btn-nav:hover { background: var(--mystic-purple); }
        .btn-nav.next { background: var(--mystic-purple); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .share-group { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 20px; }
        .btn-result-share { background: linear-gradient(45deg, #ff7675, #fab1a0); color: white; border: none; font-size: 1.2rem; padding: 18px; border-radius: 20px; cursor: pointer; font-family: 'Jua'; }
        .btn-again { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); }
    </style>
</head>
<body>

<div class="container">
    <!-- 입력 레이어 -->
    <div id="inputLayer">
        <h1>✨ 운명의 성좌 분석 ✨</h1>
        <form id="loveForm" action="https://docs.google.com/forms/d/e/1FAIpQLSeKkP4HuJ5J4jW_XOrs2ryEpfSeuWn5VvbaOmMQhHKTmAxUpg/formResponse" method="POST" target="hidden_iframe">
            <div class="section">
                <div class="section-title">🔮 나의 우주</div>
                <input type="text" id="myName" placeholder="당신의 성함" required>
                <input type="text" id="myPhone" placeholder="휴대폰 번호 (01012345678)" required>
                <div class="flex-row">
                    <div class="flex-item"><label>생년월일</label><input type="date" id="myBirth" required></div>
                    <div class="flex-item"><label>태어난 시간</label><input type="time" id="myTime"></div>
                </div>
                <select id="myGender"><option value="남성">남성</option><option value="여성">여성</option></select>
            </div>

            <div class="section">
                <div class="section-title">🌟 상대의 성좌</div>
                <input type="text" id="yourName" placeholder="상대방 성함" required>
                <input type="text" id="yourPhone" placeholder="상대방 번호" required>
                <div class="flex-row">
                    <div class="flex-item"><label>생년월일</label><input type="date" id="yourBirth"></div>
                    <div class="flex-item"><label>태어난 시간</label><input type="time" id="yourTime"></div>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="birthUnknown" onchange="document.getElementById('yourBirth').disabled = this.checked; document.getElementById('yourTime').disabled = this.checked;">
                    <label for="birthUnknown">상대방 정보 모름</label>
                </div>
                <select id="yourGender"><option value="여성">여성</option><option value="남성">남성</option></select>
            </div>

            <div class="agree-box">
                <input type="checkbox" id="agree" onchange="document.getElementById('submitBtn').disabled = !this.checked">
                천문의 흐름과 데이터 분석 활용에 동의합니다.
            </div>

            <input type="hidden" name="entry.2059990547" id="gName">
            <input type="hidden" name="entry.669898893" id="gPhone">
            <input type="hidden" name="entry.708899075" id="gDetail">

            <button type="button" id="submitBtn" class="btn-submit" disabled onclick="handleAnalysis()">천기누설 시작하기 ✨</button>
        </form>
    </div>

    <!-- 결과 레이어 -->
    <div id="resultLayer">
        <h2 id="resTitle" style="color: var(--star-gold); margin-bottom: 5px; text-align: center;">인연 분석 리포트</h2>
        <p id="resSubtitle" style="font-size: 0.9rem; color: var(--light-purple); margin-bottom: 25px; text-align: center;"></p>
        
        <!-- 슬라이드 1: 점수 및 번호궁합 -->
        <div class="slide active" id="slide1">
            <div class="score-circle" id="resScore">0%</div>
            <div class="analysis-card">
                <div class="card-sub">🔢 수비학: 번호에 깃든 운명</div>
                <div id="numAnalysis"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav next" onclick="moveSlide(2)">사주 심층 분석 보기 →</button>
            </div>
        </div>

        <!-- 슬라이드 2: 사주 심층 분석 -->
        <div class="slide" id="slide2">
            <div class="analysis-card">
                <div class="card-sub" id="sajuTitle1"></div>
                <div id="sajuContent1"></div>
            </div>
            <div class="analysis-card">
                <div class="card-sub" id="sajuTitle2"></div>
                <div id="sajuContent2"></div>
            </div>
            <div class="nav-btns">
                <button class="btn-nav" onclick="moveSlide(1)">← 이전</button>
                <button class="btn-nav next" onclick="moveSlide(3)">운명의 비책 보기 →</button>
            </div>
        </div>

        <!-- 슬라이드 3: 총평 및 공유 -->
        <div class="slide" id="slide3">
            <div class="analysis-card" style="border-left-color: var(--star-gold);">
                <div class="card-sub">📍 인연의 흐름 총평</div>
                <div id="finalReview"></div>
            </div>
            <div class="analysis-card">
                <div class="card-sub">💡 관계 유지를 위한 신의 한 수</div>
                <div id="finalAdvice"></div>
            </div>
            
            <div class="share-group">
                <button class="btn-result-share" id="shareBtn" onclick="generateShareLink()">💌 인연에게 결과 링크 공유하기</button>
                <button class="btn-nav btn-again" onclick="location.href=window.location.pathname">나도 분석해보기 ↩️</button>
            </div>
        </div>
    </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    // 타로 데이터 동일 (검의 슈트 0-9)
    const tarotData = {
        1: { name: "Ace of Swords", text: "신비로운 1번의 에너지는 날카로운 진실을 향한 갈망을 상징합니다. 현재 휴대폰 번호 끝자리에 깃든 이 기운은 인연 사이에 숨김이 없어야 함을 강력하게 시사하고 있습니다. 거짓이나 미온적인 태도는 오히려 독이 되며, 차라리 뼈아픈 진실이 두 분의 관계를 더 단단하게 묶어주는 열쇠가 될 것입니다." },
        2: { name: "Two of Swords", text: "상반된 두 마음이 팽팽하게 맞서고 있는 형국입니다. 상대방과 본인의 생각 차이로 인해 선택을 미루고 있지는 않나요? 번호 끝자리 2번은 '중재'와 '유보'를 의미합니다. 지금은 서둘러 결판을 내려 하기보다는, 서로의 다름을 인정하고 수평적인 관계를 유지하는 것이 최선입니다." },
        3: { name: "Three of Swords", text: "감정적인 예민함이 정점에 달해 있는 번호입니다. 과거의 상처나 사소한 오해가 가슴 깊이 박혀 있을 가능성이 큽니다. 하지만 비가 온 뒤 땅이 굳어지듯, 이 상처는 서로를 더 깊이 이해하고 보듬기 위한 과정에 불과합니다. 날카로운 말보다는 포옹이 더 큰 치유가 됩니다." },
        4: { name: "Four of Swords", text: "지금은 잠시 멈춰야 할 때입니다. 번호가 말해주는 4의 기운은 '재충전'입니다. 관계가 너무 빠르게 진행되었거나 피로가 쌓였다면 각자만의 시간을 갖는 것이 오히려 인연을 지키는 길입니다. 서두르지 마세요. 내일의 활력을 위해 잠시 칼을 내려놓는 시기입니다." },
        5: { name: "Five of Swords", text: "자존심이 강한 두 사람이 만났을 때 자주 나타나는 숫자입니다. 이기려는 마음이 앞서 상처를 주고 있지는 않은지 돌아봐야 합니다. 사랑에서의 승리는 상대를 이기는 것이 아니라 내 안의 이기심을 꺾는 것입니다. 한 걸음 물러나 주는 것이 진정으로 인연을 장악하는 길입니다." },
        6: { name: "Six of Swords", text: "거친 파도를 지나 안식처로 향하는 긍정적인 이동을 뜻합니다. 최근 어려운 시기를 겪었다면 이제는 평화로운 시기로 접어드는 입구에 서 있습니다. 주변의 도움이나 환경의 변화를 통해 상대와의 관계를 개선할 기회를 얻게 됩니다. 함께 밝은 미래로 노를 저어가세요." },
        7: { name: "Seven of Swords", text: "단순한 사랑 이상의 지적인 밀당이 필요한 인연입니다. 100% 모든 것을 보여주기보다 적절한 신비주의를 유지하는 것이 관계의 긴장감을 유지하는 비결입니다. 너무 쉬운 사랑은 금방 식기 마련입니다. 당신만의 매력을 전략적으로 보여줄 때입니다." },
        8: { name: "Eight of Swords", text: "상대방이 당신을 묶어둔 것이 아니라, 당신의 불안과 의심이 스스로를 감옥에 가두고 있습니다. 사실 그 벽은 종이로 되어 있어 당신이 마음만 먹으면 언제든 찢고 나갈 수 있습니다. 자존감을 높이세요. 자유로운 영혼이 될 때 비로소 상대방도 당신에게 더 깊이 매료될 것입니다." },
        9: { name: "Nine of Swords", text: "생각이 너무 많아 현실을 왜곡하고 있지는 않으신가요? 9번의 에너지는 일어나지도 않은 불행을 미리 걱정하는 기운입니다. 상대방의 사소한 말투 하나에 의미를 부여하기보다, 차라리 직접 물어보는 용기가 필요합니다. 마음의 짐을 내려놓고 현재의 즐거움에 집중하세요." },
        0: { name: "Ten of Swords", text: "당신은 이미 바닥을 찍었습니다. 인연에 있어 더 이상 나빠질 수 없는 임계점에 도달했음을 0번의 기운이 말해줍니다. 하지만 이는 곧 완벽한 새로움을 뜻합니다. 고통스러운 변화일지라도 그것은 더 찬란한 태양을 맞이하기 위한 필수적인 단계입니다. 이제 다시 일어설 일만 남았습니다." }
    };

    let cacheData = null; // 링크 생성을 위한 데이터 보관

    function moveSlide(n) {
        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
        document.getElementById('slide' + n).classList.add('active');
        window.scrollTo(0,0);
    }

    function getSajuDesc(name, birth, time, gender, pLast) {
        if(!birth) return `상대방의 탄생 정보가 신비에 가려져 있어 본인의 기운을 중심으로 분석했습니다. 하지만 상대방의 번호 끝자리 ${pLast}번의 파동만으로도 강렬한 인력을 느낄 수 있습니다.`;
        const month = parseInt(birth.split('-')[1]);
        let base = "";
        if([3,4,5].includes(month)) base = `${name}님은 만물이 소생하는 봄의 정기와 강직한 '목(木)'의 기운을 타고났습니다. 굽히지 않는 대나무처럼 고결한 성정과 책임감을 지녔습니다. `;
        else if([6,7,8].includes(month)) base = `${name}님은 뜨겁게 타오르는 여름의 '화(火)' 기운을 지닌 열정적인 영혼입니다. 활기찬 에너지가 넘치고 뒤끝 없는 시원한 성격입니다. `;
        else if([9,10,11].includes(month)) base = `${name}님은 결실을 맺는 가을의 '금(金)' 기운을 타고나 냉철한 이성과 단호함을 겸비하고 있습니다. 맺고 끊음이 확실한 성품입니다. `;
        else base = `${name}님은 깊은 바다와 같은 겨울의 '수(水)' 기운을 지닌 지혜로운 책사 스타일입니다. 유연하고 적응력이 뛰어나며 통찰력이 탁월합니다. `;
        
        return base + `태어난 시간(${time || '미상'})의 묘미와 번호 끝자리 ${pLast}번의 조화가 올해의 ${gender=='여성'?'연애운':'애정운'}을 강력하게 끌어당깁니다.`;
    }

    function handleAnalysis() {
        const data = {
            n1: document.getElementById('myName').value,
            p1: document.getElementById('myPhone').value.replace(/[^0-9]/g, ''),
            b1: document.getElementById('myBirth').value,
            t1: document.getElementById('myTime').value,
            g1: document.getElementById('myGender').value,
            n2: document.getElementById('yourName').value,
            p2: document.getElementById('yourPhone').value.replace(/[^0-9]/g, ''),
            b2: document.getElementById('yourBirth').value,
            t2: document.getElementById('yourTime').value,
            g2: document.getElementById('yourGender').value
        };

        // 데이터베이스 대용(구글폼) 전송
        document.getElementById('gName').value = `${data.n1} | ${data.n2}`;
        document.getElementById('gPhone').value = `${data.p1} | ${data.p2}`;
        document.getElementById('gDetail').value = JSON.stringify(data);
        document.getElementById('loveForm').submit();

        cacheData = data;
        showResult(data);
    }

    function showResult(d) {
        document.getElementById('inputLayer').style.display = 'none';
        document.getElementById('resultLayer').style.display = 'block';
        document.getElementById('resSubtitle').innerText = `${d.n1}님 & ${d.n2}님 운명 보고서`;

        const p1Last = parseInt(d.p1.slice(-1)) || 0;
        const p2Last = parseInt(d.p2.slice(-1)) || 0;

        document.getElementById('numAnalysis').innerHTML = `<strong>[${d.n1}님]</strong> ${tarotData[p1Last].text}<br><br><strong>[${d.n2}님]</strong> ${tarotData[p2Last].text}`;
        document.getElementById('sajuTitle1').innerText = `👤 ${d.n1}님의 성향`;
        document.getElementById('sajuContent1').innerText = getSajuDesc(d.n1, d.b1, d.t1, d.g1, p1Last);
        document.getElementById('sajuTitle2').innerText = `👤 ${d.n2}님의 성향`;
        document.getElementById('sajuContent2').innerText = getSajuDesc(d.n2, d.b2, d.t2, d.g2, p2Last);

        let score = 72 + (p1Last % 5) * 3 + (p2Last % 5) * 2;
        if(p1Last === p2Last) score += 10;
        if(score > 100) score = 99;
        document.getElementById('resScore').innerText = score + "%";

        document.getElementById('finalReview').innerText = `두 분의 성좌 결합은 '${score}%'의 높은 동조율을 보입니다. 서로의 부족한 오행을 채워주는 보완적 관계이며, 특히 ${d.n1}님의 이성이 ${d.n2}님의 감성을 안정시키기에 최적입니다.`;
        document.getElementById('finalAdvice').innerText = `1. 대화 시 논리보다 공감을 우선하세요.\n2. 함께 새로운 장소로 떠나는 여행이 기운을 북돋웁니다.\n3. 사소한 오해는 그날 바로 푸는 것이 좋습니다.`;
    }

    // 결과 공유 링크 생성 (서버 없이 데이터 전달)
    function generateShareLink() {
        if(!cacheData) return;
        const json = JSON.stringify(cacheData);
        const encoded = btoa(encodeURIComponent(json)); // 데이터 인코딩
        const shareUrl = window.location.origin + window.location.pathname + "?res=" + encoded;

        const dummy = document.createElement("input");
        document.body.appendChild(dummy);
        dummy.value = shareUrl;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);

        const btn = document.getElementById('shareBtn');
        btn.innerText = "✅ 링크 복사 완료!";
        btn.style.background = "#00b894";
        alert("분석 결과 링크가 복사되었습니다! 상대방에게 전달하여 결과를 확인시켜주세요. ✨");
    }

    // 페이지 로드 시 결과 링크인지 확인
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const resData = params.get('res');
        if(resData) {
            try {
                const decoded = decodeURIComponent(atob(resData));
                const data = JSON.parse(decoded);
                cacheData = data;
                showResult(data);
                // 결과 보기 모드에서는 버튼 문구 변경
                document.getElementById('shareBtn').innerText = "🔗 나도 분석하러 가기";
                document.getElementById('shareBtn').onclick = () => { location.href = window.location.pathname; };
            } catch(e) {
                console.error("데이터 로딩 오류");
            }
        }
    };
</script>

</body>
</html>
